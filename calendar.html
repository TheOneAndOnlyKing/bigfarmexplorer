<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigfarm Calendar — Bigfarm Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233E6B35'/><text x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23F7F4EA' text-anchor='middle'>BE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --f-sans: 'Instrument Sans', system-ui, sans-serif;
    --f-serif: 'Fraunces', Georgia, serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  body[data-font="sans"]  { --ui: var(--f-sans); }
  body[data-font="serif"] { --ui: var(--f-serif); }
  body[data-font="mono"]  { --ui: var(--f-mono); }
  body[data-theme="light"] {
    --bg:#F2F0E8; --card:#FBFAF5; --ink:#22251E; --muted:#6C6F63;
    --line:#E3E0D4; --line2:#D2CEBF; --dayline:rgba(34,37,30,.08);
    --accent:#3E6B35; --on-accent:#F6F4EB; --accent-soft:rgba(62,107,53,.09);
    --wknd:rgba(62,80,50,.065); --warn:#A66A21;
    --shadow:0 1px 2px rgba(30,30,20,.05), 0 10px 30px rgba(30,30,20,.06);
    --tipbg:#22251E; --tipink:#F2F0E8;
    --bar-0:#C25B3C; --bar-1:#6D8A56; --bar-2:#D19E3A; --bar-3:#5B7BA6;
    --bar-4:#9A6E9C; --bar-5:#42968B; --bar-6:#B06675; --bar-7:#7A7233;
  }
  body[data-theme="grey"] {
    --bg:#C8C8C1; --card:#D4D4CC; --ink:#26261F; --muted:#5E5E55;
    --line:#B8B8AE; --line2:#A6A69A; --dayline:rgba(38,38,31,.09);
    --accent:#37552E; --on-accent:#EDEBE0; --accent-soft:rgba(55,85,46,.12);
    --wknd:rgba(30,35,25,.07); --warn:#8A5A1C;
    --shadow:0 1px 2px rgba(30,30,20,.08), 0 10px 30px rgba(30,30,20,.1);
    --tipbg:#26261F; --tipink:#D4D4CC;
    --bar-0:#A34A2E; --bar-1:#546F3F; --bar-2:#A87E2A; --bar-3:#425F8A;
    --bar-4:#7B5680; --bar-5:#2B7A6E; --bar-6:#8C4A59; --bar-7:#5F5A28;
  }
  body[data-theme="dark"] {
    --bg:#141711; --card:#1B1E17; --ink:#EAE9DF; --muted:#9AA092;
    --line:#2A2D22; --line2:#3A3E2C; --dayline:rgba(234,233,223,.06);
    --accent:#9CCB7E; --on-accent:#141B0C; --accent-soft:rgba(156,203,126,.12);
    --wknd:rgba(255,255,255,.035); --warn:#D9A253;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.35);
    --tipbg:#EAE9DF; --tipink:#1B1E17;
    --bar-0:#E07850; --bar-1:#93BE74; --bar-2:#E5BC58; --bar-3:#8FA9DA;
    --bar-4:#C293C6; --bar-5:#5FC2B0; --bar-6:#DE8E9C; --bar-7:#B2B45E;
  }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; -webkit-font-smoothing: antialiased; transition: background-color .25s, color .25s; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; border: 2px solid var(--card); }
  ::-webkit-scrollbar-track { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 11px 22px; border-bottom: 1px solid var(--line); }
  .home { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-height: 34px; }
  .homelogo { display: block; height: 32px; width: auto; max-width: 250px; object-fit: contain; }
  .bemark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-family: var(--f-serif); font-weight: 700; font-size: 15px; }
  .bt { font-family: var(--f-serif); font-size: 17px; font-weight: 600; }
  .themebtn { display: flex; align-items: center; gap: 8px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .themebtn:hover { color: var(--ink); border-color: var(--line2); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 22px 44px; }
  .tabs { display: flex; gap: 6px; padding: 0 18px; margin-bottom: -1px; position: relative; z-index: 2; overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 7px; white-space: nowrap; border: 1px solid transparent; border-bottom: none; padding: 8px 16px 9px; border-radius: 11px 11px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--card); border-color: var(--line); padding-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .toolbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .card.on-themes .toolbar { display: none; }
  .tb-side { display: flex; align-items: center; gap: 8px; }
  .tb-side.r { justify-content: flex-end; }
  .tb-center { display: flex; align-items: center; gap: 8px; }
  .ghostbtn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .ghostbtn:hover { color: var(--ink); border-color: var(--line2); }
  .ghostbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .nav-arrow { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); }
  .nav-arrow:hover { color: var(--ink); border-color: var(--line2); }
  .nav-label { height: 30px; padding: 0 12px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; font-weight: 600; }
  .nav-label:hover { border-color: var(--accent); color: var(--accent); }
  .nav-label svg { opacity: .5; }
  .view-count { font-size: 12px; color: var(--muted); }
  .pane { display: none; }
  .pane.active { display: block; }
  .tl-wrap { position: relative; }
  .tl { position: relative; overflow: auto; height: clamp(340px, calc(100vh - 270px), 1000px); }
  .tl-inner { position: relative; }
  .tl-head { position: sticky; top: 0; z-index: 6; display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
  .tl-corner { position: sticky; left: 0; z-index: 7; flex: none; display: flex; align-items: center; padding: 0 12px; background: var(--card); border-right: 1px solid var(--line); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .tl-headcol { position: relative; flex: none; overflow: hidden; }
  .hm-row { position: relative; height: 32px; }
  .hd-row { position: relative; height: 34px; border-top: 1px solid var(--dayline); }
  .hmonth { position: absolute; top: 0; height: 100%; display: flex; align-items: center; padding-left: 8px; border-left: 1px solid var(--line); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; overflow: hidden; white-space: nowrap; }
  .hday { position: absolute; top: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .hday i { font-style: normal; font-size: 8.5px; color: var(--muted); }
  .hday b { font-size: 11px; font-weight: 500; }
  .hday.we b, .hday.we i { color: var(--muted); }
  .hday.we { background: var(--wknd); }
  .hflag { position: absolute; top: 4px; transform: translateX(-50%); z-index: 2; background: var(--accent); color: var(--on-accent); font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border-radius: 99px; }
  .tl-lanewrap { position: relative; }
  .tl-grid { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 0; }
  .gmonth { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .gwkd { position: absolute; top: 0; bottom: 0; background: var(--wknd); }
  .gtoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .lane { display: flex; position: relative; z-index: 1; border-bottom: 1px solid var(--dayline); }
  .lane:last-child { border-bottom: none; }
  .lane-label { position: sticky; left: 0; z-index: 3; flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--card); border-right: 1px solid var(--line); }
  .lane-label .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .capdot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .ltxt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .ltxt b { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ltxt small { font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); white-space: nowrap; }
  .lane-chart { position: relative; flex: none; overflow: hidden; }
  .bar { position: absolute; border-radius: 6px; overflow: hidden; display: flex; align-items: center; padding: 0 8px; cursor: pointer; font-size: 10.5px; font-weight: 500; letter-spacing: .01em; transition: box-shadow .15s, filter .15s, opacity .2s; }
  .bar:hover { filter: brightness(1.06) saturate(1.05); box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--accent); }
  .bl { pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl.fl-on .bar:not(.is-fl) { opacity: .28; }
  .flb { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font-style: normal; font-family: var(--f-mono); font-size: 8px; font-weight: 700; letter-spacing: .08em; background: var(--accent); color: var(--on-accent); border-radius: 3px; padding: 1px 3px; pointer-events: none; }
  @keyframes flash { 0%, 100% { box-shadow: none; } 15%, 45%, 75% { box-shadow: 0 0 0 3px var(--accent); } 30%, 60% { box-shadow: 0 0 0 3px transparent; } }
  .bar.flash { animation: flash 1.4s ease; }
  .tl-empty { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-family: var(--f-serif); font-style: italic; font-size: 1.05rem; background: var(--card); background: color-mix(in srgb, var(--card) 86%, transparent); pointer-events: none; }
  .tl-empty[hidden] { display: none; }
  .tl-empty p { text-align: center; padding: 0 20px; }
  .tl-empty-btns { display: flex; gap: 8px; }
  .tl-empty .mini { pointer-events: auto; font-style: normal; }
  .mini { padding: 6px 13px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .mini:hover { color: var(--accent); border-color: var(--accent); }
  .mini:disabled { opacity: .45; cursor: default; }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .list-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .list-body { height: clamp(300px, calc(100vh - 314px), 956px); overflow: auto; padding: 4px 0 12px; }
  .sortseg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .sortseg button { padding: 4px 12px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .sortseg button + button { border-left: 1px solid var(--line); }
  .sortseg button.on { background: var(--accent); color: var(--on-accent); }
  .lg-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 6px; font-family: var(--f-serif); font-weight: 600; font-size: 14px; }
  .lg-head span { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
  .lrow { width: 100%; display: grid; grid-template-columns: 14px 1fr auto auto 44px; align-items: center; gap: 12px; text-align: left; padding: 8px 18px; border-radius: 10px; }
  .lrow:hover { background: var(--accent-soft); }
  .ldot { width: 10px; height: 10px; border-radius: 50%; }
  .ln { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ls { font-size: 11.5px; color: var(--muted); }
  .ld { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .llu { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: right; }
  .list-empty { padding: 60px 20px; text-align: center; color: var(--muted); font-family: var(--f-serif); font-style: italic; font-size: 1.05rem; }
  .flbadge { display: inline-flex; font-family: var(--f-mono); font-size: 8.5px; font-weight: 700; letter-spacing: .08em; background: var(--accent); color: var(--on-accent); border-radius: 3px; padding: 1px 4px; margin-left: 8px; vertical-align: 1px; }
  #pane-list.fl-on .lrow:not(.has-fl), #pane-list.fl-on .atable tbody tr:not(.has-fl) { opacity: .45; }
  .atable { width: 100%; min-width: 560px; border-collapse: collapse; }
  .atable th { position: sticky; top: 0; z-index: 2; background: var(--card); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line2); cursor: pointer; user-select: none; white-space: nowrap; }
  .atable th.r { text-align: right; }
  .atable th:hover { color: var(--ink); }
  .atable th.on { color: var(--ink); }
  .tri { display: inline-flex; flex-direction: column; gap: 2px; margin-left: 7px; vertical-align: -1px; }
  .tri i { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .tri .tu { border-bottom: 5px solid var(--line2); }
  .tri .td { border-top: 5px solid var(--line2); }
  .tri .tu.act { border-bottom-color: var(--accent); }
  .tri .td.act { border-top-color: var(--accent); }
  .atable td { padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  .atable tbody tr { cursor: pointer; }
  .atable tbody tr:hover { background: var(--accent-soft); }
  .atable .ldot { display: inline-block; margin-right: 9px; vertical-align: -0.5px; }
  .atable td.c-sec { font-size: 12px; color: var(--muted); }
  .atable .c-dt, .atable .c-dy { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
  .atable .c-dy { text-align: right; }
  .settings { padding: 8px 22px 26px; max-width: 860px; }
  .set-group { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .set-group:last-child { border-bottom: none; }
  .set-group h3 { font-family: var(--f-serif); font-size: 15px; font-weight: 600; display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .set-group h3 .h-note { font-family: var(--ui); font-size: 11.5px; font-weight: 400; color: var(--muted); }
  .fontopts { display: flex; gap: 10px; flex-wrap: wrap; }
  .fontopt { flex: 1; min-width: 200px; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .fontopt:hover { border-color: var(--line2); }
  .fontopt.on { border-color: var(--accent); background: var(--accent-soft); }
  .fontopt .fprev { font-size: 19px; font-weight: 600; }
  .fontopt .fname { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; width: max-content; }
  .seg button { padding: 5px 14px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; }
  .setrow .lab { font-size: 13px; }
  .setrow .lab small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .sw { position: relative; width: 40px; height: 22px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .sw i { display: block; width: 100%; height: 100%; border-radius: 99px; background: var(--line2); position: relative; transition: background .2s; }
  .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); transition: left .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { left: 21px; }
  .csub { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 4px; }
  .csub b { font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .csub-acts { display: flex; align-items: center; gap: 4px; }
  .csub-lab { font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); margin-right: 2px; }
  .crow { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-radius: 8px; }
  .csw { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid transparent; position: relative; }
  .csw:hover { border-color: var(--ink); }
  .csw.auto { border-style: dashed; border-color: var(--muted); opacity: .75; }
  .cn { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow .ov { margin-left: auto; font-family: var(--f-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .ovbtn { margin-left: auto; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; }
  .ovbtn:hover { color: var(--ink); border-color: var(--line2); }
  .ovbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .mini2 { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .mini2:hover { color: var(--accent); background: var(--accent-soft); }
  .lorow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .lorow[hidden] { display: none; }
  .loselect { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; max-width: 200px; }
  .loinput input { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; width: 220px; }
  #loStatus { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
  #loStatus.warn { color: var(--warn); }
  .dhint { font-size: 12.5px; line-height: 1.7; color: var(--muted); }
  .dhint b { color: var(--ink); }
  .dhint code { font-family: var(--f-mono); font-size: 11px; background: var(--accent-soft); border-radius: 5px; padding: 1px 5px; }
  .code { font-family: var(--f-mono); font-size: 11px; line-height: 1.6; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; overflow-x: auto; white-space: pre; }
  .dstat { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
  .dstat.warn { color: var(--warn); }
  .dbtns { display: flex; gap: 8px; margin-top: 12px; }
  .danger { padding: 7px 14px; border: 1px solid var(--line2); border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .danger:hover { border-color: var(--warn); color: var(--warn); }
  .cardfoot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); }
  .filterbtn { display: flex; align-items: center; gap: 8px; padding: 6px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .filterbtn:hover { color: var(--ink); border-color: var(--line2); }

  const $ = s => document.querySelector(s);

  function fmtD(ts) { const d = new Date(ts); return d.getUTCDate() + ' ' + M_S[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
  function fmtRange(ev) {
    if (ev.start === ev.end) return fmtD(ev.start);
    const a = new Date(ev.start), b = new Date(ev.end);
    if (a.getUTCFullYear() === b.getUTCFullYear() && a.getUTCMonth() === b.getUTCMonth())

      return a.getUTCDate() + ' ' + M_S[a.getUTCMonth()] + ' – ' + b.getUTCDate() + ' ' + M_S[b.getUTCMonth()] + ' ' + a.getUTCFullYear();

  }

  /* ── state ── */
  const now0 = new Date();
  const state = {
    theme: 'light', font: 'sans', zoom: 1,
    anchor: { y: now0.getFullYear(), m: now0.getMonth() },
    tab: 'calendar', density: 'comfortable', weekends: true, labels: true,
    sort: 'date', scale: 1, showFL: false,
    listFormat: 'informal', tsort: { col: 'start', dir: 'asc' },
    colors: { sections: {}, events: {}, secOverride: {} },
    loadouts: {}, lastLoadout: '',
    filters: { sections: [], items: [], years: [] }
  };
  let events = [], sections = [], items = [], years = [];
  let filtered = [], source = 'sample', fileName = '', skipped = 0, dataLoaded = false;
  let filtersLive = { sec: new Set(), it: new Set(), yr: new Set() };
  let noticeDismissed = false, pinned = false, resetArmed = false;

  const tl = $('#tl');
  let bufStartT = 0, bufEndT = 0, dayW = 20, savedScroll = 0, lastW = 0;
  let laneRows = new Map(), secCounts = new Map(), capWarns = new Set();
  let scrollRaf = 0, roTimer = 0, anchorSaveTimer = 0, loStatusTimer = 0;

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({
      theme: state.theme, font: state.font, zoom: state.zoom, tab: state.tab,
      anchor: state.anchor, density: state.density, weekends: state.weekends,
      labels: state.labels, sort: state.sort, scale: state.scale, showFL: state.showFL,
      listFormat: state.listFormat, tsort: state.tsort,
      colors: state.colors, loadouts: state.loadouts, lastLoadout: state.lastLoadout,
      filters: state.filters
    })); } catch (e) {}
  }
  function normVal(v) {
    if (!v || typeof v !== 'object') return null;
    if (v.t === 'h' && /^#[0-9a-fA-F]{6}$/.test(v.v || '')) return { t: 'h', v: v.v };
    if (v.t === 'p' && Number.isInteger(v.i) && v.i >= 0 && v.i <= 7) return { t: 'p', i: v.i };

  }
  function normalizeLayout(raw) {

        if (raw[k] && typeof raw[k] === 'object')

      });
      if (raw.secOverride && typeof raw.secOverride === 'object')
        for (const [k, v] of Object.entries(raw.secOverride)) if (v) out.secOverride[k] = true;
    } else {

  }
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      if (s.theme === 'light' || s.theme === 'grey' || s.theme === 'dark') state.theme = s.theme;
      if (['sans','serif','mono'].includes(s.font)) state.font = s.font;
      if ([1,3,6,12].includes(s.zoom)) state.zoom = s.zoom;
      if (['calendar','list','themes'].includes(s.tab)) state.tab = s.tab;
      if (['comfortable','compact'].includes(s.density)) state.density = s.density;
      if (typeof s.weekends === 'boolean') state.weekends = s.weekends;
      if (typeof s.labels === 'boolean') state.labels = s.labels;
      if (['date','name','section'].includes(s.sort)) state.sort = s.sort;
      if (typeof s.scale === 'number') state.scale = Math.min(3, Math.max(0.4, s.scale));
      if (typeof s.showFL === 'boolean') state.showFL = s.showFL;
      if (s.listFormat === 'informal' || s.listFormat === 'analytical') state.listFormat = s.listFormat;
      if (s.tsort && ['event','section','start','end','days'].includes(s.tsort.col))
        state.tsort = { col: s.tsort.col, dir: s.tsort.dir === 'desc' ? 'desc' : 'asc' };
      if (s.anchor && isFinite(s.anchor.y)) state.anchor = { y: s.anchor.y, m: s.anchor.m || 0 };
      if (s.colors) state.colors = normalizeLayout(s.colors);
      if (s.loadouts && typeof s.loadouts === 'object') {
        const lo = {};
        for (const [n, v] of Object.entries(s.loadouts)) if (n && v && typeof v === 'object') lo[n] = normalizeLayout(v);
        state.loadouts = lo;
      }
      if (typeof s.lastLoadout === 'string' && state.loadouts[s.lastLoadout]) state.lastLoadout = s.lastLoadout;
      if (s.filters) state.filters = s.filters;
    } catch (e) {}
  }

  /* ── data loading ── */
  function parseISO(v) {
    if (typeof v !== 'string') return null;
    const m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    const dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return Date.UTC(y, mo - 1, d);
  }
  function parseJSONL(text) {
    const list = []; let bad = 0, id = 0;
    text.split(/\r?\n/).forEach((ln, i) => {
      const s = ln.trim(); if (!s) return;
      try {
        const o = JSON.parse(s);
        const st = parseISO(o.start), en = parseISO(o.end);
        if (st == null || en == null) { bad++; console.warn('line ' + (i+1) + ': dates must be YYYY-MM-DD'); return; }
        if (en < st) { bad++; console.warn('line ' + (i+1) + ': ends before it starts — skipped'); return; }
        let name = typeof o.event === 'string' ? o.event.trim() : '';
        if (!name) { bad++; return; }
        let fl = !!o.fl;
        const flm = name.match(/\s*[-–—]\s*fl$/i);
        if (flm) { fl = true; name = name.slice(0, flm.index).trim(); }
        const base = baseName(name);
        const rec = EV_SEC.get(base);
        const section = rec ? rec.sec : (typeof o.section === 'string' && o.section.trim() ? o.section.trim() : 'Unsorted');
        list.push({
          id: id++, name, base, section, fl,
          start: st, end: en, days: Math.round((en - st) / MS) + 1,
          row: 0, seamL: false, seamR: false, flInferred: false
        });
      } catch (e) { bad++; console.warn('line ' + (i+1) + ': not valid JSON'); }
    });
    return { list, bad };
  }
  function deriveAll() {
    const known = SECTION_ORDER.map(s => s.name);
    const extra = [...new Set(events.map(e => e.section))].filter(s => !known.includes(s)).sort();
    sections = known.filter(n => events.some(e => e.section === n)).concat(extra);
    if (!sections.length) sections = known.slice(0, 1);
    items = [...new Set(events.map(e => e.base))].sort((a, b) => a.localeCompare(b));
    years = [...new Set(events.map(e => new Date(e.start).getUTCFullYear()))].sort();
    buildFilterSets();
    computeFiltered();
    computeFLInference();
    recomputeLanes();
  }
  function applyText(text, label) {
    const r = parseJSONL(text);
    events = r.list; skipped = r.bad;
    source = label === DATA_FILE ? 'file' : (label === 'sample' ? 'sample' : 'session');
    fileName = label; dataLoaded = true;
    deriveAll(); buildDrawer(); updateNotice(); updateChip(); refresh();
  }
  async function loadData() {
    try {
      const res = await fetch(DATA_FILE);
      if (!res.ok) throw new Error('http ' + res.status);
      applyText(await res.text(), DATA_FILE);
    } catch (e) { applyText(SAMPLE_JSONL, 'sample'); }
  }

  /* ── filtering ── */
  function buildFilterSets() {
    const off = state.filters;
    filtersLive.sec = new Set(sections.filter(s => !off.sections.includes(s)));
    filtersLive.it  = new Set(items.filter(i => !off.items.includes(i)));
    filtersLive.yr  = new Set(years.map(String).filter(y => !off.years.includes(y)));
  }
  function computeFiltered() {
    filtered = events.filter(e =>
      filtersLive.sec.has(e.section) && filtersLive.it.has(e.base) &&
      filtersLive.yr.has(String(new Date(e.start).getUTCFullYear())));
  }
  function offCount() {
    return state.filters.sections.length + state.filters.items.length + state.filters.years.length;
  }

  /* ── FL inference: ≥2 days running, FL active, no other weekly active ── */
  function computeFLInference() {
    filtered.forEach(e => { e.flInferred = false; });
    const flDays = new Set();
    filtered.filter(e => e.base === FL_NAME).forEach(e => {
      for (let d = e.start; d <= e.end; d += MS) flDays.add(d);
    });
    if (!flDays.size) return;
    const weeklies = filtered.filter(e => WEEKLY_SET.has(e.base));
    weeklies.forEach(e => {
      const blockers = weeklies.filter(w => w !== e && w.start <= e.end && e.start <= w.end);
      let n = 0;
      for (let d = e.start; d <= e.end; d += MS) {
        if (!flDays.has(d)) continue;
        if (blockers.some(w => w.start <= d && d <= w.end)) continue;
        n++;
      }
      e.flInferred = n >= 2;
    });
  }
  function isFL(e) { return e.fl || e.flInferred; }

  /* ── dynamic line packing with mid-day chaining ──
     rule: an event may share a row with another whose end ≤ its start
     (equal start/end day = chained, rendered with a mid-day seam)     */
  function orderOf(e) {
    const rec = EV_SEC.get(e.base);
    return rec ? rec.idx : 1000 + (e.base < '' ? 0 : 0) + e.base.charCodeAt(0);
  }
  function recomputeLanes() {
    laneRows = new Map(); secCounts = new Map(); capWarns = new Set();
    const bySec = new Map();
    filtered.forEach(e => {
      if (!bySec.has(e.section)) bySec.set(e.section, []);
      bySec.get(e.section).push(e);
    });
    const known = SECTION_ORDER.map(s => s.name);
    const order = known.filter(n => bySec.has(n))
      .concat([...bySec.keys()].filter(n => !known.includes(n)).sort());
    order.forEach(sec => {
      const evs = bySec.get(sec).slice().sort((a, b) =>
        a.start - b.start || orderOf(a) - orderOf(b) || a.id - b.id);
      secCounts.set(sec, evs.length);
      const rows = [];
      evs.forEach(ev => {
        ev.row = 0; ev.seamL = false; ev.seamR = false;
        let r = -1;
        for (let i = 0; i < rows.length; i++) {
          if (ev.start >= rows[i].lastEnd) { r = i; break; }
        }
        if (r < 0) { r = rows.length; rows.push({ lastEnd: -Infinity, evs: [] }); }
        rows[r].evs.push(ev); rows[r].lastEnd = ev.end; ev.row = r;
      });
      rows.forEach(row => {
        row.evs.sort((a, b) => a.start - b.start || a.id - b.id);
        for (let i = 0; i + 1 < row.evs.length; i++) {
          const A = row.evs[i], B = row.evs[i + 1];
          if (A.end === B.start) { A.seamR = true; B.seamL = true; }
        }
      });
      laneRows.set(sec, rows);
      const cap = SEC_CAP.get(sec);
      if (cap && rows.length > cap) {
        capWarns.add(sec);
        console.warn('“' + sec + '” uses ' + rows.length + ' lines but its cap is ' + cap + ' — overlapping events may need checking.');
      }
    });

  /* ── colours: defaults are per-event (position in its section) ── */
  let palCache = { theme: null, vals: [] };
  function palette() {
    if (palCache.theme === state.theme) return palCache.vals;
    const cs = getComputedStyle(document.body);
    palCache = { theme: state.theme, vals: [0,1,2,3,4,5,6,7].map(i => cs.getPropertyValue('--bar-' + i).trim()) };
    return palCache.vals;
  }
  function resolveColour(o) { return o.t === 'h' ? o.v : palette()[o.i]; }
  function eventColorIdx(base) {
    const rec = EV_SEC.get(base);
    return rec ? rec.idx % 8 : 5;
  }
  function sectionColor(sec) { return palette()[SEC_INDEX.get(sec) % 8] || palette()[0]; }
  function barColor(ev) {
    const c = state.colors;
    if (c.secOverride[ev.section]) return sectionColor(ev.section);
    const eo = c.events[ev.base];
    if (eo) return resolveColour(eo);
    if (ev.color) return ev.color;

  /* ── range helpers ── */
  function laneW() { return innerWidth < 760 ? 120 : 172; }
  const MINW = { 1: 8, 3: 5, 6: 1.6, 12: 1.2 };
  function refitDayW() {

  }
  function dateAtLeft() { return bufStartT + (savedScroll / dayW) * MS; }
  function chartViewMs() { return (Math.max(tl.clientWidth - laneW(), 0) / dayW) * MS; }
  function visibleRange() { const a = dateAtLeft(); return [a, a + chartViewMs()]; }
  function deriveAnchor() {
    const t = Math.min(Math.max(dateAtLeft(), bufStartT), bufEndT - 1);
    const d = new Date(t);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() };
  }
  function computeInView() {
    const a = Date.UTC(state.anchor.y, state.anchor.m, 1);
    const b = Date.UTC(state.anchor.y, state.anchor.m + state.zoom, 1);
    return filtered.filter(ev => ev.end >= a && ev.start < b);
  }
  function rangeLabel() {
    const { y, m } = state.anchor, z = state.zoom;
    if (z === 12) return String(y);
    const e = normMonth(y, m + z - 1);
    if (z === 1) return M_L[m] + ' ' + y;
    if (e.y === y) return M_S[m] + ' – ' + M_S[e.m] + ' ' + y;
    return M_S[m] + ' ' + y + ' – ' + M_S[e.m] + ' ' + e.y;
  }

  /* ── toolbar / chip / notice ── */
  function renderToolbar() {
    const { y, m } = state.anchor, z = state.zoom;
    const e = normMonth(y, m + z - 1);
    $('#rangeBtn').style.display = z === 12 ? 'none' : '';
    $('#rangeVal').textContent = z === 1 ? M_L[m] : M_S[m] + ' – ' + M_S[e.m];
    $('#yearVal').textContent = e.y === y ? String(y) : y + ' – ' + e.y;
    let n;
    if (state.tab === 'calendar') {
      const [a, b] = visibleRange();
      n = filtered.filter(ev => ev.end >= a && ev.start < b).length;
    } else n = computeInView().length;
    $('#viewCount').textContent = n + ' event' + (n !== 1 ? 's' : '') + ' in view';
  }
  function updateBadge() {
    const n = offCount(), b = $('#filterBadge');
    b.hidden = n === 0; b.textContent = n;
  }
  function dataStatusText() {
    if (source === 'sample') return 'sample data — ' + events.length + ' events';
    const nm = source === 'file' ? DATA_FILE : fileName;
    return nm + ' · ' + events.length + ' event' + (events.length !== 1 ? 's' : '') +
      (skipped ? ' · ' + skipped + ' unreadable' : '') + (source === 'session' ? ' (this session)' : '');
  }
  function updateChip() {
    const c = $('#dataChip');
    c.classList.toggle('warn', source === 'sample');
    $('#dataChipTxt').textContent = dataStatusText();
    c.title = source === 'sample'
      ? DATA_FILE + ' was not found — showing built-in sample data'
      : 'Data file: ' + (source === 'file' ? DATA_FILE : fileName);
  }
  function updateNotice() {
    const slot = $('#noticeSlot');
    if (source !== 'sample' || noticeDismissed) { slot.innerHTML = ''; return; }
    slot.innerHTML = `<div class="notice">
      <span>Showing <b>sample data</b>. Build <b>${DATA_FILE}</b> with Datepress 2 and put it in this folder — or
      <button class="mini" id="noticeLoad">load a file now</button>.</span>
      <button class="nx" id="noticeClose" aria-label="Dismiss">×</button></div>`;
  }

  /* ── rendering: the scrolling timeline ── */
  function renderTimeline() {
    const LANE_W = laneW();
    const rowH = state.density === 'compact' ? 24 : 34;
    const barH = rowH - 12;
    const totalDays = Math.round((bufEndT - bufStartT) / MS);
    const chartW = Math.round(totalDays * dayW);
    const xOf = t => (t - bufStartT) / MS * dayW;

    const months = [];
    for (let t = bufStartT; t < bufEndT; t = monthAddT(t, 1)) {
      const d = new Date(t);
      months.push({ t, mi: d.getUTCMonth(), yr: d.getUTCFullYear(), days: Math.round((monthAddT(t, 1) - t) / MS) });
    }
    const showDays = dayW >= 16, showWD = dayW >= 24;
    const todayT = todayUTC();

    let monthsHTML = '';
    months.forEach((mo, i) => {
      const x = Math.round(xOf(mo.t)), w = Math.round(mo.days * dayW);
      let lb = w > 78 ? M_L[mo.mi] : M_S[mo.mi];
      if (i === 0 || mo.mi === 0) lb += ' ' + mo.yr;
      monthsHTML += `<div class="hmonth" style="left:${x}px;width:${w}px">${lb}</div>`;
    });
    if (todayT >= bufStartT && todayT < bufEndT)
      monthsHTML += `<div class="hflag" style="left:${Math.round(xOf(todayT))}px">today</div>`;

    let daysHTML = '';
    if (showDays) {
      const wd0 = new Date(bufStartT).getUTCDay();
      for (let di = 0; di < totalDays; di++) {
        const wd = (wd0 + di) % 7, dn = new Date(bufStartT + di * MS).getUTCDate();
        daysHTML += `<div class="hday${wd === 0 || wd === 6 ? ' we' : ''}" style="left:${Math.round(di * dayW)}px;width:${Math.ceil(dayW)}px">` +
          (showWD ? `<i>${WD[wd]}</i>` : '') + `<b>${dn}</b></div>`;
      }
    }
    const gridBg = dayW >= 7
      ? `background-image:repeating-linear-gradient(90deg,var(--dayline) 0 1px,transparent 1px ${dayW}px);` : '';

    let grid = '';
    months.forEach(mo => { grid += `<div class="gmonth" style="left:${Math.round(xOf(mo.t))}px"></div>`; });
    if (state.weekends && dayW >= 7) {
      const wd0 = new Date(bufStartT).getUTCDay();
      if (wd0 === 0) grid += `<div class="gwkd" style="left:0;width:${dayW}px"></div>`;
      let di = (6 - wd0 + 7) % 7;
      for (; di < totalDays; di += 7) grid += `<div class="gwkd" style="left:${Math.round(di * dayW)}px;width:${dayW * 2}px"></div>`;
    }
    if (todayT >= bufStartT && todayT < bufEndT)
      grid += `<div class="gtoday" style="left:${Math.round(xOf(todayT))}px"></div>`;

    /* bars: iterate the packed rows per section */
    const flOn = state.showFL;
    const half = dayW / 2, seamGap = Math.min(dayW / 2, 3);
    let lanesHTML = '';
    sections.forEach(sec => {
      const rows = laneRows.get(sec) || [];
      const nRows = Math.max(rows.length, 1);
      const total = secCounts.get(sec) || 0;
      const capFlag = capWarns.has(sec)
        ? `<span class="capdot" title="More concurrent events than this section's cap — check for overlapping or stray lines"></span>` : '';
      let barsHTML = '';
      rows.forEach(row => {
        row.evs.forEach(ev => {
          if (ev.end < bufStartT || ev.start >= bufEndT) return;
          let x1 = xOf(ev.start) + (ev.seamL ? half + seamGap / 2 : 0);
          let x2 = xOf(ev.end) + dayW - (ev.seamR ? half + seamGap / 2 : 0);
          const w = Math.max(x2 - x1, 3);
          const col = barColor(ev);
          const showLbl = state.labels && w >= 54;
          const isFl = flOn && isFL(ev);
          const badge = isFl && w >= 30 ? '<i class="flb">FL</i>' : '';
          barsHTML += `<div class="bar${isFl ? ' is-fl' : ''}" data-id="${ev.id}" style="left:${x1}px;width:${w}px;top:${ev.row * rowH + (rowH - barH) / 2}px;height:${barH}px;background:${col}">` +
            (showLbl ? `<span class="bl" style="color:${textColorFor(col)}">${esc(ev.name)}${ev.fl ? ' - FL' : ''}</span>` : '') + badge + `</div>`;
        });
      });
      lanesHTML += `<div class="lane">
        <div class="lane-label" style="width:${LANE_W}px">
          <span class="dot" style="background:${sectionColor(sec)}"></span>${capFlag}
          <span class="ltxt"><b>${esc(sec)}</b><small>${total
            ? total + ' event' + (total > 1 ? 's' : '') + ' · ' + nRows + (nRows > 1 ? ' lines' : ' line')
            : 'hidden'}</small></span>
        </div>
        <div class="lane-chart" style="width:${chartW}px;height:${nRows * rowH}px">${barsHTML}</div>
      </div>`;
    });

    tl.innerHTML = `<div class="tl-inner" style="width:${LANE_W + chartW}px">
      <div class="tl-head">
        <div class="tl-corner" style="width:${LANE_W}px">sections</div>
        <div class="tl-headcol" style="width:${chartW}px;${gridBg}">
          <div class="hm-row">${monthsHTML}</div>
          ${showDays ? `<div class="hd-row">${daysHTML}</div>` : ''}
        </div>
      </div>
      <div class="tl-lanewrap">
        <div class="tl-grid" style="left:${LANE_W}px;width:${chartW}px;${gridBg}">${grid}</div>
        ${lanesHTML}
      </div>
    </div>`;
    tl.classList.toggle('fl-on', flOn);
    tl.scrollLeft = savedScroll;
  }

  function updateEmptyOverlay() {
    const el = $('#tlEmpty');
    if (!dataLoaded) { el.hidden = false; el.innerHTML = '<p>loading events…</p>'; return; }
    if (!events.length) { el.hidden = false; el.innerHTML = '<p>No events loaded.</p>'; return; }
    const [a, b] = visibleRange();
    const any = filtered.some(ev => ev.end >= a && ev.start < b);
    el.hidden = any;
    if (!any) {
      el.innerHTML = `<p>Nothing on the calendar here — keep scrolling, or…</p><div class="tl-empty-btns">
        ${filtered.length ? '<button class="mini" id="jumpFirst">Jump to first event</button>' : ''}
        ${offCount() ? '<button class="mini" id="clearF">Clear filters</button>' : ''}</div>`;
    }
  }

  /* ── buffer management (unchanged engine) ── */
  function handleScrollFrame() {
    savedScroll = tl.scrollLeft;
    const rightGap = tl.scrollWidth - tl.clientWidth - savedScroll;
    const trigger = 2 * 30.4375 * dayW;
    if (rightGap < trigger) extendRight();
    else if (savedScroll < trigger) extendLeft();
    maybeTrim();
    postScrollUpdate();
  }
  function extendRight() {
    bufEndT = monthAddT(bufEndT, 6);
    renderTimeline();
  }
  function extendLeft() {
    const old = bufStartT;
    bufStartT = monthAddT(bufStartT, -6);
    savedScroll += (old - bufStartT) / MS * dayW;
    renderTimeline();
  }
  function maybeTrim() {
    const viewL = dateAtLeft(), viewR = viewL + chartViewMs();
    const KEEP = 18 * 30.4375 * MS, STEP = 6 * 30.4375 * MS;
    let ns = bufStartT, ne = bufEndT;
    while (viewL - ns > KEEP + STEP) ns = monthAddT(ns, 6);
    while (ne - viewR > KEEP + STEP) ne = monthAddT(ne, -6);
    if (ns !== bufStartT || ne !== bufEndT) {
      savedScroll -= (ns - bufStartT) / MS * dayW;
      bufStartT = ns; bufEndT = ne;
      renderTimeline();
    }
  }
  function postScrollUpdate() {
    const a = deriveAnchor();
    if (a.y !== state.anchor.y || a.m !== state.anchor.m) state.anchor = a;
    renderToolbar();
    updateEmptyOverlay();
    clearTimeout(anchorSaveTimer);
    anchorSaveTimer = setTimeout(save, 500);
  }
  function goToDate(t, smooth) {
    const viewMs = Math.max(chartViewMs(), 30.4375 * dayW * MS);
    const marginMs = 2.5 * 30.4375 * MS;
    let delta = 0, changed = false;
    while (bufStartT > t - marginMs) { const old = bufStartT; bufStartT = monthAddT(bufStartT, -6); delta += (old - bufStartT) / MS * dayW; changed = true; }
    while (bufEndT < t + viewMs + marginMs) { bufEndT = monthAddT(bufEndT, 6); changed = true; }
    if (changed) { savedScroll += delta; renderTimeline(); }
    const x = Math.max(0, (t - bufStartT) / MS * dayW);
    if (smooth && Math.abs(x - savedScroll) > 3000) smooth = false;
    if (smooth) tl.scrollTo({ left: x, behavior: 'smooth' });
    else { savedScroll = x; tl.scrollLeft = x; }
    maybeTrim();
    postScrollUpdate();
  }
  function step(dir) {
    goToDate(Date.UTC(state.anchor.y, state.anchor.m + dir * state.zoom, 1), true);
  }

  /* ── list view ── */
  function rowHTML(ev) {
    const badge = isFL(ev) ? '<span class="flbadge">FL</span>' : '';
    return `<button class="lrow${isFL(ev) ? ' has-fl' : ''}" data-id="${ev.id}">
      <span class="ldot" style="background:${barColor(ev)}"></span>
      <span class="ln">${esc(ev.name)}${badge}</span>
      <span class="ls">${esc(ev.section)}</span>
      <span class="ld">${esc(fmtRange(ev))}</span>
      <span class="llu">${ev.days}d</span></button>`;
  }
  function informalHTML(inV) {
    const s = state.sort;
    const list = inV.slice().sort(
      s === 'name' ? (a, b) => a.name.localeCompare(b.name) :
      s === 'section' ? (a, b) => a.section === b.section ? a.start - b.start : a.section.localeCompare(b.section) :
      (a, b) => a.start - b.start || a.name.localeCompare(b.name));
    if (s !== 'date') return list.map(rowHTML).join('');
    let curKey = '', curLabel = '', buf = [];
    const groups = [];
    list.forEach(ev => {
      const d = new Date(ev.start), key = d.getUTCFullYear() + '-' + d.getUTCMonth();
      if (key !== curKey) {
        if (buf.length) groups.push({ label: curLabel, evs: buf });
        buf = []; curKey = key;
        curLabel = M_L[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
      }
      buf.push(ev);
    });
    if (buf.length) groups.push({ label: curLabel, evs: buf });
    return groups.map(g =>
      `<div class="lg"><div class="lg-head">${esc(g.label)}<span>${g.evs.length}</span></div>` +
      g.evs.map(rowHTML).join('') + `</div>`).join('');
  }
  function analyticalHTML(inV) {
    const cols = [['event','Event'],['section','Section'],['start','Start'],['end','End'],['days','Days']];
    const { col, dir } = state.tsort;
    const mul = dir === 'asc' ? 1 : -1;
    const list = inV.slice().sort((a, b) => {
      let r = 0;
      if (col === 'event') r = a.name.localeCompare(b.name);
      else if (col === 'section') r = a.section.localeCompare(b.section) || a.name.localeCompare(b.name);
      else if (col === 'start') r = a.start - b.start || a.name.localeCompare(b.name);
      else if (col === 'end') r = a.end - b.end || a.name.localeCompare(b.name);
      else r = a.days - b.days || a.start - b.start;
      return r * mul;
    });
    const head = cols.map(([c, l]) => {
      const on = col === c;
      return `<th data-col="${c}" class="${on ? 'on' : ''}${c === 'days' ? ' r' : ''}" title="Sort by ${l}"><span>${l}</span>` +
        `<span class="tri"><i class="tu${on && dir === 'asc' ? ' act' : ''}"></i><i class="td${on && dir === 'desc' ? ' act' : ''}"></i></span></th>`;
    }).join('');
    const rows = list.map(ev => `<tr data-id="${ev.id}" class="${isFL(ev) ? 'has-fl' : ''}">
      <td><span class="ldot" style="background:${barColor(ev)}"></span>${esc(ev.name)}${isFL(ev) ? '<span class="flbadge">FL</span>' : ''}</td>
      <td class="c-sec">${esc(ev.section)}</td>
      <td class="c-dt">${fmtD(ev.start)}</td>
      <td class="c-dt">${fmtD(ev.end)}</td>
      <td class="c-dy">${ev.days}</td></tr>`).join('');
    return `<table class="atable"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  function renderList() {
    const inV = computeInView();
    const fmt = state.listFormat;
    const head = `<div class="list-head">
      <span>${inV.length} event${inV.length !== 1 ? 's' : ''} · ${esc(rangeLabel())}</span>
      <div class="list-acts">
        <div class="seg">
          <button data-fmt="informal"${fmt === 'informal' ? ' class="on"' : ''}>Informal</button>
          <button data-fmt="analytical"${fmt === 'analytical' ? ' class="on"' : ''}>Analytical</button>
        </div>

      </div></div>`;
    let body;
    if (!inV.length) body = `<div class="list-empty">Nothing here — try another range or loosen the filters.</div>`;
    else body = fmt === 'analytical' ? analyticalHTML(inV) : informalHTML(inV);

  /* ── themes pane ── */

  function renderPane(t) {

  function setTab(t) {

      $('#pane-' + p).classList.toggle('active', p === t));

  /* ── colour load-outs / import / export ── */
  function loStatus(msg, warn) {
    const el = $('#loStatus'); if (!el) return;
    el.textContent = msg; el.classList.toggle('warn', !!warn);
    clearTimeout(loStatusTimer);
    loStatusTimer = setTimeout(() => { if (el.isConnected) el.textContent = ''; }, 3200);
  }
  const DEFAULT_LAYOUT = null;   /* future: baked-in Default layout for Reset colours */
  function resetColours() {
    if (state.loadouts['Default']) {
      state.colors = clone(state.loadouts['Default']);
      state.lastLoadout = 'Default';
      loStatus('reset to the Default load-out');
    } else if (DEFAULT_LAYOUT) {
      state.colors = clone(DEFAULT_LAYOUT);
      state.lastLoadout = '';
      loStatus('reset to the Default layout');
    } else {
      state.colors = { sections: {}, events: {}, secOverride: {} };
      state.lastLoadout = '';
      loStatus('colours reset to automatic');
    }
    save(); buildDrawer(); renderPane('themes'); if (state.tab === 'calendar') renderTimeline();
  }
  function exportColours() {
    const data = { format: 'bigfarm-colours', version: 1, exported: new Date().toISOString(), current: state.colors, loadouts: state.loadouts };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url; a.download = 'bigfarm-colours.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    loStatus('exported colours + load-outs');
  }
  function importColoursText(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { loStatus("couldn't read that as JSON", true); return; }
    let applied = false, imported = 0;
    if (obj && typeof obj === 'object') {
      if (obj.loadouts && typeof obj.loadouts === 'object') {
        for (const [n, v] of Object.entries(obj.loadouts)) {
          if (n && v && typeof v === 'object') { state.loadouts[n] = normalizeLayout(v); imported++; }
        }
      }
      const cur = obj.current || ((obj.sections || obj.events || obj.secOverride) ? obj : null);
      if (cur) { state.colors = normalizeLayout(cur); applied = true; }
    }
    if (!applied && !imported) { loStatus('no colour layouts found in that file', true); return; }
    if (!state.loadouts[state.lastLoadout]) state.lastLoadout = '';
    save(); buildDrawer();
    setTab('themes');
    loStatus('imported' + (imported ? ' ' + imported + ' load-out' + (imported > 1 ? 's' : '') : '') + (applied ? ' + current colours' : ''));
  }

  /* ── tooltip ── */

    tip.style.display = 'block';

    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
    let y = r.top - h - 8; if (y < 60) y = r.bottom + 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';

  /* ── popovers ── */
  const pop = $('#pop');
  let popAnchor = null, popHandler = null;
  function openPop(anchor, title, html, handler) {
    pop.innerHTML = `<div class="poptitle">${title}</div>` + html;
    popHandler = handler; popAnchor = anchor;
    pop.style.display = 'block';
    const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x = Math.min(Math.max(8, r.left), innerWidth - pw - 8);
    let y = r.bottom + 6; if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 6);

  /* ── filter drawer ── */

    const cntSec = s => events.filter(e => e.section === s).length;
    const cntIt = i => events.filter(e => e.base === i).length;
    const cntYr = y => events.filter(e => new Date(e.start).getUTCFullYear() === y).length;
    const dGroup = (key, title, rowsHTML, search) =>
      `<div class="dgroup"><div class="dg-head"><b>${title}</b><span class="dg-acts">

      dGroup('sections', 'Sections', sections.map(s =>
        `<label class="drow"><input type="checkbox" data-g="sections" value="${esc(s)}" ${filtersLive.sec.has(s) ? 'checked' : ''}>
         <span class="dot" style="background:${sectionColor(s)}"></span><span class="dv">${esc(s)}</span><span class="cnt">${cntSec(s)}</span></label>`).join('')) +

    homeLogo.hidden = true; homeMark.hidden = false;

  /* ── interactions ── */

    applyTheme(); palCache.theme = null; syncLogo(); save();
    buildDrawer(); refresh();
  });
  function applyTheme() {
    document.body.dataset.theme = state.theme;
    const icons = {
      light: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>',
      grey: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>',
      dark: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
    };
    $('#themeIc').innerHTML = icons[state.theme];
    $('#themeLb').textContent = state.theme[0].toUpperCase() + state.theme.slice(1);
    syncLogo();
  }
  function applyFont() { document.body.dataset.font = state.font; }

  $('#prevBtn').addEventListener('click', () => step(-1));
  $('#nextBtn').addEventListener('click', () => step(1));
  $('#todayBtn').addEventListener('click', () => goToDate(todayUTC(), true));
  $('#rangeBtn').addEventListener('click', openMonthPop);
  $('#yearBtn').addEventListener('click', openYearPop);
  $('#flBtn').addEventListener('click', () => {
    state.showFL = !state.showFL;
    $('#flBtn').classList.toggle('on', state.showFL);
    $('#flBtn').setAttribute('aria-pressed', state.showFL);
    refresh(); save();
  });

  $('#zoomSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-z]'); if (!b) return;
    const z = +b.dataset.z; if (z === state.zoom) return;
    state.zoom = z; state.scale = 1; updateScaleUI();
    document.querySelectorAll('#zoomSeg button').forEach(x => x.classList.toggle('on', x === b));
    rebuildAroundAnchor(); save();
  });
  function rebuildAroundAnchor() {
    refitDayW();
    const aT = Date.UTC(state.anchor.y, state.anchor.m, 1);
    bufStartT = monthAddT(aT, -BUF_MONTHS);
    bufEndT = monthAddT(aT, state.zoom + BUF_MONTHS);
    savedScroll = (aT - bufStartT) / MS * dayW;
    renderTimeline(); renderToolbar(); updateEmptyOverlay();
  }
  function setScale(f) {
    const center = dateAtLeft() + chartViewMs() / 2;
    state.scale = Math.min(3, Math.max(0.4, +(state.scale * f).toFixed(3)));
    refitDayW();
    savedScroll = Math.max(0, (center - bufStartT) / MS * dayW - Math.max(tl.clientWidth - laneW(), 0) / 2);
    renderTimeline(); renderToolbar(); updateEmptyOverlay(); updateScaleUI(); save();
  }
  function updateScaleUI() { $('#zPct').textContent = Math.round(state.scale * 100) + '%'; }
  $('#zIn').addEventListener('click', () => setScale(1.2));
  $('#zOut').addEventListener('click', () => setScale(1 / 1.2));

  $('#filterBtn').addEventListener('click', () => document.body.classList.add('drawer-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('drawer-open'));
  $('#drawerClose').addEventListener('click', () => document.body.classList.remove('drawer-open'));
  $('#drawerReset').addEventListener('click', () => {
    state.filters = { sections: [], items: [], years: [] };
    buildFilterSets(); computeFiltered(); computeFLInference(); recomputeLanes(); buildDrawer(); updateBadge(); refresh(); save();
  });
  $('#drawerBody').addEventListener('change', e => {
    const c = e.target.closest('input[data-g]'); if (!c) return;
    toggleFilter(c.dataset.g, c.value, c.checked);
    buildFilterSets(); computeFiltered(); computeFLInference(); recomputeLanes(); updateBadge(); refresh(); updateDrawerFoot(); save();
  });
  $('#drawerBody').addEventListener('click', e => {
    const a = e.target.closest('[data-all]'), n = e.target.closest('[data-none]');
    if (a) setAllGroup(a.dataset.all, true);
    if (n) setAllGroup(n.dataset.none, false);
  });
  $('#drawerBody').addEventListener('input', e => {
    const s = e.target.closest('.dsearch'); if (!s) return;
    const q = s.value.toLowerCase();
    s.closest('.dgroup').querySelectorAll('.drow').forEach(r => {
      r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  tl.addEventListener('scroll', () => {
    hideTip(); pinned = false;
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; handleScrollFrame(); });
  }, { passive: true });

  tl.addEventListener('click', e => {
    const j = e.target.closest('#jumpFirst');
    if (j) {
      const ev = filtered.slice().sort((a, b) => a.start - b.start)[0];
      if (ev) goToDate(ev.start, true);
      return;
    }
    if (e.target.closest('#clearF')) {
      state.filters = { sections: [], items: [], years: [] };
      buildFilterSets(); computeFiltered(); computeFLInference(); recomputeLanes(); buildDrawer(); updateBadge(); refresh(); save();
      return;
    }
    const b = e.target.closest('.bar');
    if (b) { pinned = true; showTip(b); }
    else { pinned = false; hideTip(); }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.bar')) { pinned = false; hideTip(); }
  });

  $('#pane-list').addEventListener('click', e => {
    const th = e.target.closest('.atable th[data-col]');
    if (th) {
      const c = th.dataset.col;
      if (state.tsort.col === c) state.tsort.dir = state.tsort.dir === 'asc' ? 'desc' : 'asc';
      else state.tsort = { col: c, dir: 'asc' };
      renderList(); save(); return;
    }
    const f = e.target.closest('[data-fmt]');
    if (f) { state.listFormat = f.dataset.fmt; renderList(); save(); return; }
    const s = e.target.closest('[data-sort]');
    if (s) { state.sort = s.dataset.sort; renderList(); save(); return; }
    const r = e.target.closest('[data-id]');
    if (r) jumpToEvent(+r.dataset.id);
  });

  function jumpToEvent(id) {
    const ev = events.find(x => x.id === id); if (!ev) return;
    setTab('calendar');
    goToDate(ev.start, false);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const b = tl.querySelector('.bar[data-id="' + id + '"]');
      if (b) {
        b.scrollIntoView({ block: 'nearest', inline: 'center' });
        savedScroll = tl.scrollLeft;
        b.classList.add('flash');
        setTimeout(() => b.classList.remove('flash'), 1500);
      }
    }));
    save();
  }

  /* themes pane */
  $('#pane-themes').addEventListener('click', e => {
    if (e.target.closest('#loSave')) { $('#loInputRow').hidden = false; $('#loName').focus(); return; }
    if (e.target.closest('#loCancel')) { $('#loInputRow').hidden = true; return; }
    if (e.target.closest('#loConfirm')) {
      const name = ($('#loName').value || '').trim();
      if (!name) { $('#loName').focus(); return; }
      state.loadouts[name] = clone(state.colors);
      state.lastLoadout = name; save(); renderPane('themes'); return;
    }
    if (e.target.closest('#loUpdate')) {
      if (!state.lastLoadout || !state.loadouts[state.lastLoadout]) return;
      state.loadouts[state.lastLoadout] = clone(state.colors); save();
      const b = e.target.closest('#loUpdate');
      b.textContent = 'updated';
      setTimeout(() => { if (b.isConnected) b.textContent = 'update'; }, 1200);
      return;
    }
    if (e.target.closest('#loDelete')) {
      if (state.lastLoadout) { delete state.loadouts[state.lastLoadout]; state.lastLoadout = ''; save(); renderPane('themes'); }
      return;
    }
    if (e.target.closest('#loExport')) { exportColours(); return; }
    if (e.target.closest('#loImport')) { $('#colImport').click(); return; }
    if (e.target.closest('#resetColours')) { resetColours(); return; }
    const ovT = e.target.closest('[data-ovsec]');
    if (ovT) {
      const sec = ovT.dataset.ovsec;
      if (state.colors.secOverride[sec]) delete state.colors.secOverride[sec];
      else state.colors.secOverride[sec] = true;
      save(); buildDrawer(); renderPane('themes'); if (state.tab === 'calendar') renderTimeline(); return;
    }
    if (e.target.closest('[data-ovall]')) {
      sections.forEach(s => state.colors.secOverride[s] = true);
      save(); buildDrawer(); renderPane('themes'); if (state.tab === 'calendar') renderTimeline(); return;
    }
    if (e.target.closest('[data-ovnone]')) {
      state.colors.secOverride = {};
      save(); buildDrawer(); renderPane('themes'); if (state.tab === 'calendar') renderTimeline(); return;
    }
    const ssw = e.target.closest('[data-secname]');
    if (ssw) { openColorPop('section', ssw.dataset.secname, ssw); return; }
    const f = e.target.closest('.fontopt');
    if (f) { state.font = f.dataset.font; applyFont(); renderPane('themes'); refresh(); save(); return; }
    const d = e.target.closest('[data-density]');
    if (d) { state.density = d.dataset.density; renderPane('themes'); if (state.tab === 'calendar') renderTimeline(); save(); return; }
    const sw = e.target.closest('[data-cname]');
    if (sw) { openColorPop('event', sw.dataset.cname, sw); return; }
    if (e.target.closest('#reloadBtn')) { loadData(); return; }
    if (e.target.closest('#loadFileBtn')) { $('#fileInput').click(); return; }
    if (e.target.closest('#resetBtn')) {
      if (!resetArmed) { resetArmed = true; renderPane('themes'); setTimeout(() => { resetArmed = false; }, 3000); }
      else { try { localStorage.removeItem(LS_KEY); } catch (e2) {} location.reload(); }
    }
  });
  $('#pane-themes').addEventListener('change', e => {
    if (e.target.id === 'loSelect') {
      const n = e.target.value;
      if (n && state.loadouts[n]) {
        state.colors = clone(state.loadouts[n]);
        state.lastLoadout = n; save(); renderPane('themes'); if (state.tab === 'calendar') renderTimeline();
      }
      return;
    }
    if (e.target.id === 'wkndSw') { state.weekends = e.target.checked; save(); if (state.tab === 'calendar') renderTimeline(); }
    if (e.target.id === 'lblSw') { state.labels = e.target.checked; save(); if (state.tab === 'calendar') renderTimeline(); }
    if (e.target.id === 'flSw') { state.showFL = e.target.checked; $('#flBtn').classList.toggle('on', state.showFL); refresh(); save(); }
  });
  $('#pane-themes').addEventListener('keydown', e => {
    if (e.target.id === 'loName' && e.key === 'Enter') { e.preventDefault(); $('#loConfirm').click(); }
  });
  $('#colImport').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => importColoursText(t)); e.target.value = '';
  });

  $('#dataChip').addEventListener('click', () => {
    setTab('themes');
    $('#pane-themes').querySelector('.settings').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.addEventListener('click', e => {
    if (e.target.closest('#noticeLoad')) $('#fileInput').click();
    if (e.target.closest('#noticeClose')) { noticeDismissed = true; updateNotice(); }
  });

  $('#fileInput').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => applyText(t, f.name)); e.target.value = '';
  });
  let dragDepth = 0;
  addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) $('#drop').classList.add('on'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } });
  addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
    const f = e.dataTransfer.files[0]; if (f) f.text().then(t => applyText(t, f.name));
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { pinned = false; hideTip(); closePop(); document.body.classList.remove('drawer-open'); }
  });

  new ResizeObserver(() => {
    if (state.tab !== 'calendar') return;
    cancelAnimationFrame(roTimer);
    roTimer = requestAnimationFrame(() => {
      const w = tl.clientWidth;
      if (Math.abs(w - lastW) <= 8) return;
      lastW = w;
      const center = dateAtLeft() + chartViewMs() / 2;
      refitDayW();
      savedScroll = Math.max(0, (center - bufStartT) / MS * dayW - Math.max(tl.clientWidth - laneW(), 0) / 2);
      renderTimeline(); renderToolbar(); updateEmptyOverlay();
    });
  }).observe(tl);

  /* ── init ── */
  loadSettings();
  applyTheme(); applyFont();
  $('#flBtn').classList.toggle('on', state.showFL);
  $('#flBtn').setAttribute('aria-pressed', state.showFL);
  document.querySelectorAll('#zoomSeg button').forEach(b => b.classList.toggle('on', +b.dataset.z === state.zoom));
  updateScaleUI();
  refitDayW();
  const initAT = Date.UTC(state.anchor.y, state.anchor.m, 1);
  bufStartT = monthAddT(initAT, -BUF_MONTHS);
  bufEndT = monthAddT(initAT, state.zoom + BUF_MONTHS);
  savedScroll = (initAT - bufStartT) / MS * dayW;
  lastW = tl.clientWidth;
  setTab(state.tab);
  updateNotice(); updateChip(); updateBadge();
  loadData();
})();
</script>
</body>
</html>
