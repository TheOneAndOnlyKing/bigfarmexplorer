<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigfarm Calendar — Bigfarm Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%233E6B35'/><text x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23F7F4EA' text-anchor='middle'>BE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --f-sans: 'Instrument Sans', system-ui, sans-serif;
    --f-serif: 'Fraunces', Georgia, serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  body[data-font="sans"]  { --ui: var(--f-sans); }
  body[data-font="serif"] { --ui: var(--f-serif); }
  body[data-font="mono"]  { --ui: var(--f-mono); }
  body[data-theme="light"] {
    --bg:#F2F0E8; --card:#FBFAF5; --ink:#22251E; --muted:#6C6F63;
    --line:#E3E0D4; --line2:#D2CEBF; --dayline:rgba(34,37,30,.08);
    --accent:#3E6B35; --on-accent:#F6F4EB; --accent-soft:rgba(62,107,53,.09);
    --wknd:rgba(62,80,50,.065); --warn:#A66A21;
    --shadow:0 1px 2px rgba(30,30,20,.05), 0 10px 30px rgba(30,30,20,.06);
    --tipbg:#22251E; --tipink:#F2F0E8;
    --bar-0:#C25B3C; --bar-1:#6D8A56; --bar-2:#D19E3A; --bar-3:#5B7BA6;
    --bar-4:#9A6E9C; --bar-5:#42968B; --bar-6:#B06675; --bar-7:#7A7233;
  }
  body[data-theme="grey"] {
    --bg:#C8C8C1; --card:#D4D4CC; --ink:#26261F; --muted:#5E5E55;
    --line:#B8B8AE; --line2:#A6A69A; --dayline:rgba(38,38,31,.09);
    --accent:#37552E; --on-accent:#EDEBE0; --accent-soft:rgba(55,85,46,.12);
    --wknd:rgba(30,35,25,.07); --warn:#8A5A1C;
    --shadow:0 1px 2px rgba(30,30,20,.08), 0 10px 30px rgba(30,30,20,.1);
    --tipbg:#26261F; --tipink:#D4D4CC;
    --bar-0:#A34A2E; --bar-1:#546F3F; --bar-2:#A87E2A; --bar-3:#425F8A;
    --bar-4:#7B5680; --bar-5:#2B7A6E; --bar-6:#8C4A59; --bar-7:#5F5A28;
  }
  body[data-theme="dark"] {
    color-scheme: dark;
    --bg:#141711; --card:#1B1E17; --ink:#EAE9DF; --muted:#9AA092;
    --line:#2A2D22; --line2:#3A3E2C; --dayline:rgba(234,233,223,.06);
    --accent:#9CCB7E; --on-accent:#141B0C; --accent-soft:rgba(156,203,126,.12);
    --wknd:rgba(255,255,255,.035); --warn:#D9A253;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.35);
    --tipbg:#EAE9DF; --tipink:#1B1E17;
    --bar-0:#E07850; --bar-1:#93BE74; --bar-2:#E5BC58; --bar-3:#8FA9DA;
    --bar-4:#C293C6; --bar-5:#5FC2B0; --bar-6:#DE8E9C; --bar-7:#B2B45E;
  }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; -webkit-font-smoothing: antialiased; transition: background-color .25s, color .25s; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; border: 2px solid var(--card); }
  ::-webkit-scrollbar-track { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 11px 22px; border-bottom: 1px solid var(--line); }
  .home { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-height: 34px; }
  .homelogo { display: block; height: 32px; width: auto; max-width: 260px; object-fit: contain; }
  .homefall { font-family: var(--f-serif); font-size: 17px; font-weight: 600; }
  .bt { font-family: var(--f-serif); font-size: 17px; font-weight: 600; }
  .themebtn { display: flex; align-items: center; gap: 8px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .themebtn:hover { color: var(--ink); border-color: var(--line2); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 22px 44px; }
  .tabs { display: flex; gap: 6px; padding: 0 18px; margin-bottom: -1px; position: relative; z-index: 2; overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 7px; white-space: nowrap; border: 1px solid transparent; border-bottom: none; padding: 8px 16px 9px; border-radius: 11px 11px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--card); border-color: var(--line); padding-bottom: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }

  .toolbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .card.on-themes .toolbar { display: none; }
  .tb-side { display: flex; align-items: center; gap: 8px; }
  .tb-side.r { justify-content: flex-end; }
  .tb-center { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-mid { display: flex; align-items: center; gap: 8px; }
  .ghostbtn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .ghostbtn:hover { color: var(--ink); border-color: var(--line2); }
  .ghostbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .nav-arrow { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); }
  .nav-arrow:hover { color: var(--ink); border-color: var(--line2); }
  .nav-label { height: 30px; padding: 0 12px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; font-weight: 600; }
  .nav-label:hover { border-color: var(--accent); color: var(--accent); }
  .nav-label svg { opacity: .5; }
  .rangelbl { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .dateinput { font: inherit; font-size: 12.5px; font-family: var(--ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 5px 8px; }
  .dateinput:focus { outline: none; border-color: var(--accent); }
  .view-count { font-size: 12px; color: var(--muted); }

  .pane { display: none; }
  .pane.active { display: block; }
  .tl-wrap { position: relative; }
  .tl { position: relative; overflow: auto; height: clamp(340px, calc(100vh - 280px), 1000px); }
  .tl-inner { position: relative; }
  .tl-head { position: sticky; top: 0; z-index: 6; display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
  .tl-corner { position: sticky; left: 0; z-index: 7; flex: none; display: flex; align-items: center; padding: 0 12px; background: var(--card); border-right: 1px solid var(--line); font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .tl-headcol { position: relative; flex: none; overflow: hidden; }
  .hm-row { position: relative; height: 32px; }
  .hd-row { position: relative; height: 34px; border-top: 1px solid var(--dayline); }
  .hmonth { position: absolute; top: 0; height: 100%; display: flex; align-items: center; padding-left: 8px; border-left: 1px solid var(--line); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; overflow: hidden; white-space: nowrap; }
  .hday { position: absolute; top: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .hday i { font-style: normal; font-size: 8.5px; color: var(--muted); }
  .hday b { font-size: 11px; font-weight: 500; }
  .hday.we b, .hday.we i { color: var(--muted); }
  .hday.we { background: var(--wknd); }
  .hflag { position: absolute; top: 4px; transform: translateX(-50%); z-index: 2; background: var(--accent); color: var(--on-accent); font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border-radius: 99px; }
  .tl-lanewrap { position: relative; }
  .tl-grid { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 0; }
  .gmonth { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .gwkd { position: absolute; top: 0; bottom: 0; background: var(--wknd); }
  .gtoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .lane { display: flex; position: relative; z-index: 1; border-bottom: 1px solid var(--dayline); }
  .lane:last-child { border-bottom: none; }
  .lane-label { position: sticky; left: 0; z-index: 3; flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--card); border-right: 1px solid var(--line); }
  .lane-label .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .capdot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .ltxt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .ltxt b { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ltxt small { font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); white-space: nowrap; }
  .lane-chart { position: relative; flex: none; overflow: hidden; }
  .bar { position: absolute; border-radius: 6px; overflow: hidden; display: flex; align-items: center; padding: 0 8px; cursor: pointer; font-size: 10.5px; font-weight: 500; letter-spacing: .01em; transition: box-shadow .15s, filter .15s, opacity .2s; }
  .bar:hover { filter: brightness(1.06) saturate(1.05); box-shadow: 0 0 0 1.5px var(--card), 0 0 0 3px var(--accent); }
  .bl { pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blo { position: absolute; display: flex; align-items: center; font-size: 10px; font-weight: 500; color: var(--ink); opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; z-index: 2; }
  .blo.dim { opacity: .3; }
  .tl.fl-on .bar:not(.is-fl) { opacity: .28; }
  .flb { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); font-style: normal; font-family: var(--f-mono); font-size: 8px; font-weight: 700; letter-spacing: .08em; background: var(--accent); color: var(--on-accent); border-radius: 3px; padding: 1px 3px; pointer-events: none; }
  @keyframes flash { 0%, 100% { box-shadow: none; } 15%, 45%, 75% { box-shadow: 0 0 0 3px var(--accent); } 30%, 60% { box-shadow: 0 0 0 3px transparent; } }
  .bar.flash { animation: flash 1.4s ease; }
  .tl-empty { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-family: var(--f-serif); font-style: italic; font-size: 1.05rem; background: var(--card); background: color-mix(in srgb, var(--card) 86%, transparent); pointer-events: none; }
  .tl-empty[hidden] { display: none; }
  .tl-empty p { text-align: center; padding: 0 20px; }
  .tl-empty-btns { display: flex; gap: 8px; }
  .tl-empty .mini { pointer-events: auto; font-style: normal; }
  .mini { padding: 6px 13px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .mini:hover { color: var(--accent); border-color: var(--accent); }
  .mini:disabled { opacity: .45; cursor: default; }

  .vresize { display: flex; align-items: center; justify-content: center; height: 18px; cursor: row-resize; border-top: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
  .vresize span { width: 48px; height: 5px; border-radius: 3px; background: #3E7FC1; transition: background .15s, width .15s; }
  .vresize:hover span, .vresize.drag span { background: #2A5E97; width: 62px; }
  .card.on-themes .vresize { display: none; }

  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .lh-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .sortseg, .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .sortseg button, .seg button { padding: 4px 12px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .sortseg button + button, .seg button + button { border-left: 1px solid var(--line); }
  .sortseg button.on, .seg button.on { background: var(--accent); color: var(--on-accent); }
  .sortseg button:disabled { opacity: .35; cursor: default; }
  .sortseg button:disabled:hover { color: var(--muted); }
  .list-body { height: clamp(300px, calc(100vh - 324px), 956px); overflow: auto; padding: 4px 0 12px; }
  .lg-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 6px; font-family: var(--f-serif); font-weight: 600; font-size: 14px; }
  .lg-head span { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
  .lrow { width: 100%; display: grid; grid-template-columns: 14px 1fr auto auto 44px; align-items: center; gap: 12px; text-align: left; padding: 8px 18px; border-radius: 10px; }
  .lrow:hover { background: var(--accent-soft); }
  .ldot { width: 10px; height: 10px; border-radius: 50%; }
  .ln { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ls { font-size: 11.5px; color: var(--muted); }
  .ld { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .llu { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: right; }
  .list-empty { padding: 60px 20px; text-align: center; color: var(--muted); font-family: var(--f-serif); font-style: italic; font-size: 1.05rem; }
  .flbadge { display: inline-flex; font-family: var(--f-mono); font-size: 8.5px; font-weight: 700; letter-spacing: .08em; background: var(--accent); color: var(--on-accent); border-radius: 3px; padding: 1px 4px; margin-left: 8px; vertical-align: 1px; }
  #pane-list.fl-on .lrow:not(.has-fl), #pane-list.fl-on .atable tbody tr:not(.has-fl) { opacity: .45; }
  .atable { width: 100%; min-width: 560px; border-collapse: collapse; }
  .atable th { position: sticky; top: 0; z-index: 2; background: var(--card); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line2); cursor: pointer; user-select: none; white-space: nowrap; }
  .atable th.r { text-align: right; }
  .atable th:hover { color: var(--ink); }
  .atable th.on { color: var(--ink); }
  .tri { display: inline-flex; flex-direction: column; gap: 2px; margin-left: 7px; vertical-align: -1px; }
  .tri i { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .tri .tu { border-bottom: 5px solid var(--line2); }
  .tri .td { border-top: 5px solid var(--line2); }
  .tri .tu.act { border-bottom-color: var(--accent); }
  .tri .td.act { border-top-color: var(--accent); }
  .atable td { padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  .atable tbody tr { cursor: pointer; }
  .atable tbody tr:hover { background: var(--accent-soft); }
  .atable .ldot { display: inline-block; margin-right: 9px; vertical-align: -0.5px; }
  .atable td.c-sec { font-size: 12px; color: var(--muted); }
  .atable .c-dt, .atable .c-dy { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
  .atable .c-dy { text-align: right; }

  .settings { padding: 8px 22px 26px; max-width: 880px; }
  .set-group { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .set-group:last-child { border-bottom: none; }
  .set-group h3 { font-family: var(--f-serif); font-size: 15px; font-weight: 600; display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .set-group h3 .h-note { font-family: var(--ui); font-size: 11.5px; font-weight: 400; color: var(--muted); }
  .fontopts { display: flex; gap: 10px; flex-wrap: wrap; }
  .fontopt { flex: 1; min-width: 200px; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .fontopt:hover { border-color: var(--line2); }
  .fontopt.on { border-color: var(--accent); background: var(--accent-soft); }
  .fontopt .fprev { font-size: 19px; font-weight: 600; }
  .fontopt .fname { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; }
  .setrow .lab { font-size: 13px; }
  .setrow .lab small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .sw { position: relative; width: 40px; height: 22px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .sw i { display: block; width: 100%; height: 100%; border-radius: 99px; background: var(--line2); position: relative; transition: background .2s; }
  .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); transition: left .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { left: 21px; }

  .csub { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 6px; }
  .csub b { font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .csub-acts { display: flex; align-items: center; gap: 4px; }
  .csub-lab { font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); margin-right: 2px; }
  .cgroup { margin-bottom: 2px; }
  .crow { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-radius: 8px; }
  .crow.cevt .cn { padding-left: 18px; }
  .csw { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid transparent; position: relative; }
  .csw:hover { border-color: var(--ink); }
  .csw.auto { border-style: dashed; border-color: var(--muted); opacity: .75; }
  .cn { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow .ov { margin-left: auto; font-family: var(--f-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .ovbtn { margin-left: auto; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; }
  .ovbtn:hover { color: var(--ink); border-color: var(--line2); }
  .ovbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .mini2 { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .mini2:hover { color: var(--accent); background: var(--accent-soft); }
  .lorow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .lorow[hidden] { display: none; }
  .loselect { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; max-width: 200px; }
  .loinput input { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; width: 220px; }
  #loStatus { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
  #loStatus.warn { color: var(--warn); }
  .dhint { font-size: 12.5px; line-height: 1.7; color: var(--muted); }
  .dhint b { color: var(--ink); }
  .dstat { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
  .dstat.warn { color: var(--warn); }
  .dbtns { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .danger { padding: 7px 14px; border: 1px solid var(--line2); border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .danger:hover { border-color: var(--warn); color: var(--warn); }

  .cardfoot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); }

  }

  /* ── toolbar ── */
  function renderToolbar() {
    var onList = state.tab === 'list';
    $('#calCenter').style.display = onList ? 'none' : '';
    $('#listCenter').style.display = onList ? '' : 'none';
    var n;
    if (onList) {
      var fd = $('#fromDate'), td = $('#toDate');
      if (document.activeElement !== fd) fd.value = state.listFrom != null ? isoOf(state.listFrom) : '';
      if (document.activeElement !== td) td.value = state.listTo != null ? isoOf(state.listTo) : '';
      n = computeInView().length;
      $('#viewCount').textContent = n + ' event' + (n !== 1 ? 's' : '') + ' in range';
    } else {
      var y = state.anchor.y, m = state.anchor.m, z = state.zoom;
      $('#rangeBtn').style.display = z === 12 ? 'none' : '';
      if (z === 7) {
        var t0 = Math.floor(dateAtLeft() / MS) * MS;
        var a = new Date(t0), b = new Date(t0 + 6 * MS);
        $('#rangeVal').textContent = a.getUTCMonth() === b.getUTCMonth()
          ? a.getUTCDate() + ' – ' + b.getUTCDate() + ' ' + M_S[b.getUTCMonth()]
          : a.getUTCDate() + ' ' + M_S[a.getUTCMonth()] + ' – ' + b.getUTCDate() + ' ' + M_S[b.getUTCMonth()];
        $('#yearVal').textContent = String(b.getUTCFullYear());
      } else {
        var e = normMonth(y, m + z - 1);
        $('#rangeVal').textContent = z === 1 ? M_L[m] : M_S[m] + ' – ' + M_S[e.m];
        $('#yearVal').textContent = e.y === y ? String(y) : y + ' – ' + e.y;
      }
      var vr = visibleRange();
      n = filtered.filter(function (ev) { return ev.end >= vr[0] && ev.start < vr[1]; }).length;
      $('#viewCount').textContent = n + ' event' + (n !== 1 ? 's' : '') + ' in view';
    }
  }
  function updateBadge() {
    var n = offCount(), b = $('#filterBadge');
    b.hidden = n === 0;
    b.textContent = n;
  }
  function updateNotice() {
    var slot = $('#noticeSlot');
    if (source !== 'sample' || noticeDismissed) { slot.innerHTML = ''; return; }
    slot.innerHTML = '<div class="notice">' +
      '<span>Showing <b>sample data</b>. Save your events as <b>Events Machine.txt</b> (or events.jsonl) in this folder — or ' +
      '<button class="mini" id="noticeLoad">load a file now</button>.</span>' +
      '<button class="nx" id="noticeClose" aria-label="Dismiss">×</button></div>';
  }

  /* ── timeline ── */
  function renderTimeline() {
    var LANE_W = laneW();
    var rowH = state.density === 'compact' ? 24 : 34;
    var barH = rowH - 12;
    var totalDays = Math.round((bufEndT - bufStartT) / MS);
    var chartW = Math.round(totalDays * dayW);
    function xOf(t) { return (t - bufStartT) / MS * dayW; }

    var months = [];
    for (var t = bufStartT; t < bufEndT; t = monthAddT(t, 1)) {
      var d = new Date(t);
      months.push({ t: t, mi: d.getUTCMonth(), yr: d.getUTCFullYear(), days: Math.round((monthAddT(t, 1) - t) / MS) });
    }
    var showDays = dayW >= 16, showWD = dayW >= 24;
    var todayT = todayUTC();

    var monthsHTML = '';
    months.forEach(function (mo, i) {
      var x = Math.round(xOf(mo.t)), w = Math.round(mo.days * dayW);
      var lb = w > 78 ? M_L[mo.mi] : M_S[mo.mi];
      if (i === 0 || mo.mi === 0) lb += ' ' + mo.yr;
      monthsHTML += '<div class="hmonth" style="left:' + x + 'px;width:' + w + 'px">' + lb + '</div>';
    });
    if (todayT >= bufStartT && todayT < bufEndT)
      monthsHTML += '<div class="hflag" style="left:' + Math.round(xOf(todayT)) + 'px">today</div>';

    var daysHTML = '';
    if (showDays) {
      var wd0 = new Date(bufStartT).getUTCDay();
      for (var di = 0; di < totalDays; di++) {
        var wd = (wd0 + di) % 7, dn = new Date(bufStartT + di * MS).getUTCDate();
        daysHTML += '<div class="hday' + (wd === 0 || wd === 6 ? ' we' : '') + '" style="left:' + Math.round(di * dayW) + 'px;width:' + Math.ceil(dayW) + 'px">' +
          (showWD ? '<i>' + WD[wd] + '</i>' : '') + '<b>' + dn + '</b></div>';
      }
    }
    var gridBg = dayW >= 7
      ? 'background-image:repeating-linear-gradient(90deg,var(--dayline) 0 1px,transparent 1px ' + dayW + 'px);' : '';

    var grid = '';
    months.forEach(function (mo) { grid += '<div class="gmonth" style="left:' + Math.round(xOf(mo.t)) + 'px"></div>'; });
    if (state.weekends && dayW >= 7) {
      var wd0b = new Date(bufStartT).getUTCDay();
      if (wd0b === 0) grid += '<div class="gwkd" style="left:0;width:' + dayW + 'px"></div>';
      var di2 = (6 - wd0b + 7) % 7;
      for (; di2 < totalDays; di2 += 7) grid += '<div class="gwkd" style="left:' + Math.round(di2 * dayW) + 'px;width:' + dayW * 2 + 'px"></div>';
    }
    if (todayT >= bufStartT && todayT < bufEndT)
      grid += '<div class="gtoday" style="left:' + Math.round(xOf(todayT)) + 'px"></div>';

    var flOn = state.showFL;
    var half = dayW / 2;
    var sgap = Math.min(dayW / 2, 3);
    var minBar = Math.max(2, Math.min(dayW * 0.4, 10));
    var lanesHTML = '';
    sections.forEach(function (sec) {
      var rows = laneRows.get(sec) || [];
      var nRows = Math.max(rows.length, 1);
      var total = secCounts.get(sec) || 0;
      var capFlag = capWarns.has(sec)
        ? '<span class="capdot" title="More concurrent events than this section\'s cap — check for overlapping or stray lines"></span>' : '';
      var barsHTML = '';
      rows.forEach(function (row) {
        row.evs.forEach(function (ev, i) {
          if (ev.end < bufStartT || ev.start >= bufEndT) return;
          var x1 = xOf(ev.start) + half + (ev.seamL ? sgap / 2 : 0);
          var x2 = xOf(ev.end) + half - (ev.seamR ? sgap / 2 : 0);
          if (x2 - x1 < minBar && !ev.seamL) x1 = x2 - minBar;
          var w = Math.max(x2 - x1, 1.5);
          var right = x1 + w;
          var top = ev.row * rowH + (rowH - barH) / 2;
          var col = barColor(ev);
          var isFl = flOn && isFL(ev);

          var inLbl = '', outLbl = '';
          if (state.labels) {
            if (w >= 40) {
              inLbl = '<span class="bl" style="color:' + textColorFor(col) + '">' + esc(ev.name) + (ev.fl ? ' - FL' : '') + '</span>';
            } else {
              var next = row.evs[i + 1];
              var limit = next ? xOf(next.start) + half + (next.seamL ? sgap / 2 : 0) : chartW;
              var room = limit - right - 8;
              if (room >= 34) {
                outLbl = '<span class="blo' + (flOn && !isFl ? ' dim' : '') + '" style="left:' + (right + 5) + 'px;top:' + top + 'px;height:' + barH + 'px;max-width:' + Math.min(room, 170) + 'px">' + esc(ev.name) + (ev.fl ? ' · FL' : '') + '</span>';
              }
            }
          }
          var badge = isFl && w >= 26 ? '<i class="flb">FL</i>' : '';
          barsHTML += '<div class="bar' + (isFl ? ' is-fl' : '') + '" data-id="' + ev.id + '" style="left:' + x1 + 'px;width:' + w + 'px;top:' + top + 'px;height:' + barH + 'px;background:' + col + '">' + inLbl + badge + '</div>' + outLbl;
        });
      });
      lanesHTML += '<div class="lane">' +
        '<div class="lane-label" style="width:' + LANE_W + 'px">' +
          '<span class="dot" style="background:' + sectionColor(sec) + '"></span>' + capFlag +
          '<span class="ltxt"><b>' + esc(sec) + '</b><small>' + (total
            ? total + ' event' + (total > 1 ? 's' : '') + ' · ' + nRows + (nRows > 1 ? ' lines' : ' line')
            : 'hidden') + '</small></span>' +
        '</div>' +
        '<div class="lane-chart" style="width:' + chartW + 'px;height:' + nRows * rowH + 'px">' + barsHTML + '</div>' +
      '</div>';
    });

    tl.innerHTML = '<div class="tl-inner" style="width:' + (LANE_W + chartW) + 'px">' +
      '<div class="tl-head">' +
        '<div class="tl-corner" style="width:' + LANE_W + 'px">sections</div>' +
        '<div class="tl-headcol" style="width:' + chartW + 'px;' + gridBg + '">' +
          '<div class="hm-row">' + monthsHTML + '</div>' +
          (showDays ? '<div class="hd-row">' + daysHTML + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="tl-lanewrap">' +
        '<div class="tl-grid" style="left:' + LANE_W + 'px;width:' + chartW + 'px;' + gridBg + '">' + grid + '</div>' +
        lanesHTML +
      '</div>' +
    '</div>';
    tl.classList.toggle('fl-on', flOn);
    tl.scrollLeft = savedScroll;
  }

  function updateEmptyOverlay() {
    var el = $('#tlEmpty');
    if (!dataLoaded) { el.hidden = false; el.innerHTML = '<p>loading events…</p>'; return; }
    if (!events.length) { el.hidden = false; el.innerHTML = '<p>No events loaded.</p>'; return; }
    var vr = visibleRange();
    var any = filtered.some(function (ev) { return ev.end >= vr[0] && ev.start < vr[1]; });
    el.hidden = any;
    if (!any) {
      el.innerHTML = '<p>Nothing on the calendar here — keep scrolling, or…</p><div class="tl-empty-btns">' +
        (filtered.length ? '<button class="mini" id="jumpFirst">Jump to first event</button>' : '') +
        (offCount() ? '<button class="mini" id="clearF">Clear filters</button>' : '') + '</div>';
    }
  }

  /* ── buffer management ── */
  function handleScrollFrame() {
    savedScroll = tl.scrollLeft;
    var rightGap = tl.scrollWidth - tl.clientWidth - savedScroll;
    var trigger = 2 * 30.4375 * dayW;
    if (rightGap < trigger) extendRight();
    else if (savedScroll < trigger) extendLeft();
    maybeTrim();
    postScrollUpdate();
  }
  function extendRight() {
    bufEndT = monthAddT(bufEndT, 6);
    renderTimeline();
  }
  function extendLeft() {
    var old = bufStartT;
    bufStartT = monthAddT(bufStartT, -6);
    savedScroll += (old - bufStartT) / MS * dayW;
    renderTimeline();
  }
  function maybeTrim() {
    var viewL = dateAtLeft(), viewR = viewL + chartViewMs();
    var KEEP = 18 * 30.4375 * MS, STEP = 6 * 30.4375 * MS;
    var ns = bufStartT, ne = bufEndT;
    while (viewL - ns > KEEP + STEP) ns = monthAddT(ns, 6);
    while (ne - viewR > KEEP + STEP) ne = monthAddT(ne, -6);
    if (ns !== bufStartT || ne !== bufEndT) {
      savedScroll -= (ns - bufStartT) / MS * dayW;
      bufStartT = ns; bufEndT = ne;
      renderTimeline();
    }
  }
  function postScrollUpdate() {
    var a = deriveAnchor();
    if (a.y !== state.anchor.y || a.m !== state.anchor.m) state.anchor = a;
    renderToolbar();
    updateEmptyOverlay();
    clearTimeout(anchorSaveTimer);
    anchorSaveTimer = setTimeout(save, 500);
  }
  function goToDate(t) {
    var viewMs = Math.max(chartViewMs(), zoomDays(7) * dayW * MS);
    var marginMs = 2.5 * 30.4375 * MS;
    var delta = 0, changed = false;
    while (bufStartT > t - marginMs) { var old = bufStartT; bufStartT = monthAddT(bufStartT, -6); delta += (old - bufStartT) / MS * dayW; changed = true; }
    while (bufEndT < t + viewMs + marginMs) { bufEndT = monthAddT(bufEndT, 6); changed = true; }
    if (changed) { savedScroll += delta; renderTimeline(); }
    var x = Math.max(0, (t - bufStartT) / MS * dayW);
    savedScroll = x;
    tl.scrollLeft = x;
    maybeTrim();
    postScrollUpdate();
  }
  function step(dir) {
    if (state.tab === 'list' && state.listFrom != null && state.listTo != null) {
      var dur = Math.max(state.listTo - state.listFrom, MS);
      state.listFrom += dir * dur;
      state.listTo += dir * dur;
      save(); renderToolbar(); renderList();
      return;
    }
    if (state.zoom === 7) {
      var t = Math.floor(dateAtLeft() / MS) * MS + dir * 7 * MS;
      goToDate(t);
    } else {
      goToDate(Date.UTC(state.anchor.y, state.anchor.m + dir * state.zoom, 1));
    }
  }

  /* ── list view ── */
  function rowHTML(ev) {
    var badge = isFL(ev) ? '<span class="flbadge">FL</span>' : '';
    return '<button class="lrow' + (isFL(ev) ? ' has-fl' : '') + '" data-id="' + ev.id + '">' +
      '<span class="ldot" style="background:' + barColor(ev) + '"></span>' +
      '<span class="ln">' + esc(ev.name) + badge + '</span>' +
      '<span class="ls">' + esc(ev.section) + '</span>' +
      '<span class="ld">' + esc(fmtRange(ev)) + '</span>' +
      '<span class="llu">' + ev.days + 'd</span></button>';
  }
  function informalHTML(inV) {
    var s = state.sort;
    var list = inV.slice().sort(
      s === 'name' ? function (a, b) { return a.name.localeCompare(b.name); } :
      s === 'section' ? function (a, b) { return a.section === b.section ? a.start - b.start : a.section.localeCompare(b.section); } :
      function (a, b) { return a.start - b.start || a.name.localeCompare(b.name); });
    if (s !== 'date') return list.map(rowHTML).join('');
    var curKey = '', curLabel = '', buf = [];
    var groups = [];
    list.forEach(function (ev) {
      var d = new Date(ev.start), key = d.getUTCFullYear() + '-' + d.getUTCMonth();
      if (key !== curKey) {
        if (buf.length) groups.push({ label: curLabel, evs: buf });
        buf = []; curKey = key;
        curLabel = M_L[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
      }
      buf.push(ev);
    });
    if (buf.length) groups.push({ label: curLabel, evs: buf });
    return groups.map(function (g) {
      return '<div class="lg"><div class="lg-head">' + esc(g.label) + '<span>' + g.evs.length + '</span></div>' +
        g.evs.map(rowHTML).join('') + '</div>';
    }).join('');
  }
  function analyticalHTML(inV) {
    var cols = [['event','Event'],['section','Section'],['start','Start'],['end','End'],['days','Days']];
    var col = state.tsort.col, dir = state.tsort.dir;
    var mul = dir === 'asc' ? 1 : -1;
    var list = inV.slice().sort(function (a, b) {
      var r = 0;
      if (col === 'event') r = a.name.localeCompare(b.name);
      else if (col === 'section') r = a.section.localeCompare(b.section) || a.name.localeCompare(b.name);
      else if (col === 'start') r = a.start - b.start || a.name.localeCompare(b.name);
      else if (col === 'end') r = a.end - b.end || a.name.localeCompare(b.name);
      else r = a.days - b.days || a.start - b.start;
      return r * mul;
    });
    var head = cols.map(function (c) {
      var on = col === c[0];
      return '<th data-col="' + c[0] + '" class="' + (on ? 'on' : '') + (c[0] === 'days' ? ' r' : '') + '" title="Sort by ' + c[1] + '"><span>' + c[1] + '</span>' +
        '<span class="tri"><i class="tu' + (on && dir === 'asc' ? ' act' : '') + '"></i><i class="td' + (on && dir === 'desc' ? ' act' : '') + '"></i></span></th>';
    }).join('');
    var rows = list.map(function (ev) {
      return '<tr data-id="' + ev.id + '" class="' + (isFL(ev) ? 'has-fl' : '') + '">' +
        '<td><span class="ldot" style="background:' + barColor(ev) + '"></span>' + esc(ev.name) + (isFL(ev) ? '<span class="flbadge">FL</span>' : '') + '</td>' +
        '<td class="c-sec">' + esc(ev.section) + '</td>' +
        '<td class="c-dt">' + fmtD(ev.start) + '</td>' +
        '<td class="c-dt">' + fmtD(ev.end) + '</td>' +
        '<td class="c-dy">' + ev.days + '</td></tr>';
    }).join('');
    return '<table class="atable"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>';
  }
  function renderList() {
    var inV = computeInView();
    var fmt = state.listFormat;
    var ana = fmt === 'analytical';
    var rng = state.listFrom != null ? esc(fmtListRange()) : esc(rangeLabel());
    var head = '<div class="list-head">' +
      '<span>' + inV.length + ' event' + (inV.length !== 1 ? 's' : '') + (rng ? ' · ' + rng : '') + '</span>' +
      '<span class="lh-controls">' +
        '<div class="sortseg">' + [['date','Date'],['name','Name'],['section','Section']].map(function (v) {
          return '<button data-sort="' + v[0] + '"' + (state.sort === v[0] ? ' class="on"' : '') + (ana ? ' disabled' : '') + '>' + v[1] + '</button>';
        }).join('') + '</div>' +
        '<div class="seg">' +
          '<button data-fmt="informal"' + (fmt === 'informal' ? ' class="on"' : '') + '>Informal</button>' +
          '<button data-fmt="analytical"' + (ana ? ' class="on"' : '') + '>Analytical</button>' +
        '</div>' +
      '</span></div>';
    var body;
    if (!inV.length) body = '<div class="list-empty">Nothing in this range — try different dates or loosen the filters.</div>';
    else body = ana ? analyticalHTML(inV) : informalHTML(inV);
    var pane = $('#pane-list');
    pane.innerHTML = head + '<div class="list-body">' + body + '</div>';
    pane.classList.toggle('fl-on', state.showFL);
    if (state.vHeight) { var lb = pane.querySelector('.list-body'); if (lb) lb.style.height = state.vHeight + 'px'; }
  }

  /* ── themes pane ── */
  function renderThemes() {
    var fonts = [
      ['sans', 'Instrument Sans', 'clean sans — the default'],
      ['serif', 'Fraunces', 'bookish serif'],
      ['mono', 'IBM Plex Mono', 'technical mono']
    ];
    var c = state.colors;
    var loNames = Object.keys(state.loadouts).sort(function (a, b) { return a.localeCompare(b); });
    var loSel = loNames.includes(state.lastLoadout) ? state.lastLoadout : '';

    var groupsHTML = sections.map(function (sec) {
      var ov = c.sections[sec];
      var on = !!c.secOverride[sec];
      var evs = orderedItems(sec);
      var evRows = evs.map(function (nm) {
        var own = c.events[nm];
        var col = own ? resolveColour(own) : palette()[eventColorIdx(nm)];
        return '<div class="crow cevt">' +
          '<button class="csw' + (own ? '' : ' auto') + '" data-cname="' + esc(nm) + '" style="background:' + col + '" title="Set colour"></button>' +
          '<span class="cn">' + esc(nm) + '</span>' + (own ? '<span class="ov">custom</span>' : '') + '</div>';
      }).join('');
      return '<div class="cgroup">' +
        '<div class="crow">' +
          '<button class="csw' + (ov ? '' : ' auto') + '" data-secname="' + esc(sec) + '" style="background:' + sectionColor(sec) + '" title="Set section colour"></button>' +
          '<span class="cn"><b>' + esc(sec) + '</b></span>' +
          '<button class="ovbtn' + (on ? ' on' : '') + '" data-ovsec="' + esc(sec) + '" title="' +
            (on ? 'Events in this section are using the section colour — click to release them' : 'Make every event in this section use the section colour') + '">' +
            (on ? 'overriding' : 'override events') + '</button>' +
        '</div>' + evRows + '</div>';
    }).join('');

    $('#pane-themes').innerHTML = '<div class="settings">' +
      '<div class="set-group"><h3>Font <span class="h-note">applies to the whole page, remembered</span></h3>' +
        '<div class="fontopts">' + fonts.map(function (f) {
          return '<button class="fontopt' + (state.font === f[0] ? ' on' : '') + '" data-font="' + f[0] + '">' +
            '<span class="fprev" style="font-family:var(--f-' + f[0] + ')">' + f[1] + '</span>' +
            '<span class="fname">' + f[2] + '</span></button>';
        }).join('') + '</div>' +
      '</div>' +
      '<div class="set-group"><h3>Display</h3>' +
        '<div class="setrow"><span class="lab">Row density<small>how tall each event line is</small></span>' +
          '<div class="seg"><button data-density="comfortable" class="' + (state.density === 'comfortable' ? 'on' : '') + '">Comfortable</button><button data-density="compact" class="' + (state.density === 'compact' ? 'on' : '') + '">Compact</button></div></div>' +
        '<div class="setrow"><span class="lab">Weekend shading<small>faint tint on Sat/Sun when zoomed in</small></span>' +
          '<label class="sw"><input type="checkbox" id="wkndSw"' + (state.weekends ? ' checked' : '') + '><i></i></label></div>' +
        '<div class="setrow"><span class="lab">Event labels<small>on the bars when they fit, beside them when they don\'t</small></span>' +
          '<label class="sw"><input type="checkbox" id="lblSw"' + (state.labels ? ' checked' : '') + '><i></i></label></div>' +
        '<div class="setrow"><span class="lab">FL highlighting<small>the FL button on the Calendar &amp; List tabs</small></span>' +
          '<label class="sw"><input type="checkbox" id="flSw"' + (state.showFL ? ' checked' : '') + '><i></i></label></div>' +
      '</div>' +
      '<div class="set-group">' +
        '<h3>Colours <span class="h-note">defaults are per-event, grouped by section</span>' +
          '<button class="mini2" id="resetColours" style="margin-left:auto" title="Return to the Default layout">Reset colours</button></h3>' +
        '<p class="dhint" style="margin:0 0 10px">Default template — ' + (defaultFound ? 'loaded from ' + esc(TEMPLATE_FILE) : 'not found; add ' + esc(TEMPLATE_FILE) + ' to this folder anytime') + '.</p>' +
        '<div class="lorow">' +
          '<select class="loselect" id="loSelect"' + (loNames.length ? '' : ' disabled') + '>' +
            (loNames.length
              ? loNames.map(function (n) { return '<option value="' + esc(n) + '"' + (n === loSel ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('')
              : '<option value="">no load-outs saved yet</option>') +
          '</select>' +
          '<button class="mini" id="loSave">save as…</button>' +
          '<button class="mini" id="loUpdate"' + (loSel ? '' : ' disabled') + '>update</button>' +
          '<button class="mini" id="loDelete"' + (loSel ? '' : ' disabled') + '>delete</button>' +
        '</div>' +
        '<div class="lorow">' +
          '<button class="mini" id="loExport" title="Download your current colours + every saved load-out as a file">export file</button>' +
          '<button class="mini" id="loImport" title="Load colour layouts from an exported file">import file…</button>' +
          '<span id="loStatus"></span>' +
        '</div>' +
        '<div class="lorow loinput" id="loInputRow" hidden>' +
          '<input id="loName" type="text" placeholder="load-out name — e.g. Default" maxlength="24">' +
          '<button class="mini" id="loConfirm">save</button>' +
          '<button class="mini" id="loCancel">cancel</button>' +
        '</div>' +
        '<div class="csub"><b>sections &amp; events</b>' +
          '<span class="csub-acts"><span class="csub-lab">event override:</span>' +

  function renderPane(t) {
    if (t === 'calendar') { renderTimeline(); updateEmptyOverlay(); }
    else if (t === 'list') renderList();
    else renderThemes();
  }
  function refresh() { renderToolbar(); updateBadge(); renderPane(state.tab); }
  function setTab(t) {
    state.tab = t;
    save();
    document.querySelectorAll('.tab').forEach(function (b) {
      var on = b.dataset.tab === t;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on);
    });
    $('#card').classList.toggle('on-themes', t === 'themes');
    ['calendar', 'list', 'themes'].forEach(function (p) {
      $('#pane-' + p).classList.toggle('active', p === t);
    });
    if (t === 'list' && state.listFrom == null) {
      state.listFrom = Date.UTC(state.anchor.y, state.anchor.m, 1);
      state.listTo = state.listFrom + (Math.round(zoomDays(state.zoom)) - 1) * MS;
    }
    if (t === 'calendar') {
      if (pendingZoomRebuild) { pendingZoomRebuild = false; rebuildAroundAnchor(); }
      else { var old = dayW; refitDayW(); savedScroll = savedScroll / old * dayW; }
    }
    renderPane(t);
    renderToolbar();
  }

  /* ── colour load-outs / default template ── */
  function loStatus(msg, warn) {
    var el = $('#loStatus');
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('warn', !!warn);
    clearTimeout(loStatusTimer);
    loStatusTimer = setTimeout(function () { if (el.isConnected) el.textContent = ''; }, 3200);
  }
  function resetColours() {
    if (DEFAULT_LAYOUT) {
      state.colors = clone(DEFAULT_LAYOUT);
      state.lastLoadout = '';
      loStatus('reset to the default template');
    } else if (state.loadouts['Default']) {
      state.colors = clone(state.loadouts['Default']);
      state.lastLoadout = 'Default';
      loStatus('reset to the Default load-out');
    } else {
      state.colors = { sections: {}, events: {}, secOverride: {} };
      state.lastLoadout = '';
      loStatus('colours reset to automatic');
    }
    save();
    buildDrawer();
    renderPane('themes');
    if (state.tab === 'calendar') renderTimeline();
  }
  function exportColours() {
    var data = { format: 'bigfarm-colours', version: 1, exported: new Date().toISOString(), current: state.colors, loadouts: state.loadouts };
    downloadText(JSON.stringify(data, null, 2), 'bigfarm-colours.json');
    loStatus('exported colours + load-outs');
  }
  function importColoursText(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { loStatus("couldn't read that as JSON", true); return; }
    var applied = false, imported = 0;
    if (obj && typeof obj === 'object') {
      if (obj.loadouts && typeof obj.loadouts === 'object') {
        for (var n in obj.loadouts) {
          if (n && obj.loadouts[n] && typeof obj.loadouts[n] === 'object') { state.loadouts[n] = normalizeLayout(obj.loadouts[n]); imported++; }
        }
      }
      var cur = obj.current || ((obj.sections || obj.events || obj.secOverride) ? obj : null);
      if (cur) { state.colors = normalizeLayout(cur); applied = true; }
    }
    if (!applied && !imported) { loStatus('no colour layouts found in that file', true); return; }
    if (!state.loadouts[state.lastLoadout]) state.lastLoadout = '';
    save();
    buildDrawer();
    setTab('themes');
    loStatus('imported' + (imported ? ' ' + imported + ' load-out' + (imported > 1 ? 's' : '') : '') + (applied ? ' + current colours' : ''));
  }
  function fetchDefaultTemplate() {
    fetch(TEMPLATE_FILE)
      .then(function (r) { if (!r.ok) throw new Error('missing'); return r.json(); })
      .then(function (o) {
        var cur = (o && typeof o === 'object' && o.current) ? o.current : o;
        DEFAULT_LAYOUT = normalizeLayout(cur);
        defaultFound = true;
        if (!hasOverrides(state.colors)) {
          state.colors = clone(DEFAULT_LAYOUT);
          buildDrawer();
          refresh();
        } else if (state.tab === 'themes') {
          renderPane('themes');
        }
      })
      .catch(function () {});
  }

  /* ── exports ── */
  function downloadText(text, name) {
    var blob = new Blob([text], { type: 'text/plain' });
    var a = document.createElement('a');
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  function exportEvents(machine) {
    var el = $('#expStatus');
    if (!events.length) { el.textContent = 'nothing loaded to export'; return; }
    var text;
    if (machine) {
      text = events.map(function (e) {
        var o = { start: isoOf(e.start), end: isoOf(e.end), event: e.name, section: e.section };
        if (e.fl) o.fl = true;
        return JSON.stringify(o);
      }).join('\n');
    } else {
      text = events.slice().sort(function (a, b) { return a.start - b.start; }).map(function (e) {
        var s = dmy(e.start);
        return (e.start === e.end ? s : s + ' → ' + dmy(e.end)) + ' · ' + e.name + (e.fl ? ' - FL' : '');
      }).join('\n');
    }
    downloadText(text + '\n', machine ? 'Events Machine.txt' : 'Events Readable.txt');
    el.textContent = 'exported ' + events.length + ' events';
    setTimeout(function () { if (el.isConnected) el.textContent = ''; }, 2500);
  }

      '<span class="sec">' + esc(ev.section) + '</span>' +

      (isFL(ev) ? '<span class="fl">COUNTS FOR FL</span>' : '');

      html += '<div class="tlinks">';
      ls.forEach(function (l) {
        var st = l.color ? ' style="color:' + l.color + '"' : '';

        html += '<a class="tlink" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer"' + st + '>' +

    x = Math.min(Math.max(8, x), innerWidth - w - 8);

  function openColorPop(kind, key, anchor) {

      '<input class="dsearch" type="search" placeholder="find an event…">';

      html += '<div class="dgroup" data-sec="' + esc(sec) + '">' +
        '<label class="drow dsec">' +
          '<span class="dot" style="background:' + sectionColor(sec) + '"></span>' +
          '<span class="dv">' + esc(sec) + '</span><span class="cnt">' + cnt + '</span>' +
          '<input type="checkbox" data-g="sections" value="' + esc(sec) + '"' + (filtersLive.sec.has(sec) ? ' checked' : '') + ' title="Toggle the whole section"></label>' +
        '<div class="dgrid">' +
          evs.map(function (nm) {

              '<input type="checkbox" data-g="items" value="' + esc(nm) + '"' + (filtersLive.it.has(nm) ? ' checked' : '') + '></label>';
          }).join('') +

  function toggleFilter(g, v, on) {

  /* ── logo ── */
  var homeLogo = $('#homeLogo'), homeFall = $('#homeFall');

  logoProbe.onload = function () { darkLogoOK = true; syncLogo(); };
  logoProbe.src = 'logo-dark.png';
  function syncLogo() {
    if (!homeLogo || homeLogo.hidden) return;
    var want = (state.theme !== 'light' && darkLogoOK) ? 'logo-dark.png' : 'logo.png';
    if (homeLogo.getAttribute('src') !== want) homeLogo.src = want;
  }
  homeLogo.addEventListener('error', function () {
    if (homeLogo.getAttribute('src') === 'logo-dark.png') { homeLogo.src = 'logo.png'; return; }
    homeLogo.hidden = true;
    homeFall.hidden = false;
  });

  /* ── resizable panes ── */
  function applyVHeight() {
    var h = state.vHeight;
    tl.style.height = h ? h + 'px' : '';
    var lb = document.querySelector('#pane-list .list-body');
    if (lb) lb.style.height = h ? h + 'px' : '';
  }
  var vResize = $('#vResize');
  var vhDrag = null;
  function activePaneEl() {
    return state.tab === 'list' ? (document.querySelector('#pane-list .list-body') || $('#pane-list')) : tl;
  }
  vResize.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { window.getSelection().removeAllRanges(); } catch (err) {}
    vResize.setPointerCapture(e.pointerId);
    vResize.classList.add('drag');
    var c = activePaneEl();
    vhDrag = { y: e.clientY, h: c ? c.offsetHeight : 420 };
  });
  vResize.addEventListener('pointermove', function (e) {
    if (!vhDrag) return;
    /* handle sits below the window: drag DOWN grows it, drag UP shrinks it */
    var h = Math.max(240, Math.min(2200, vhDrag.h + (e.clientY - vhDrag.y)));
    state.vHeight = h;
    applyVHeight();
  });
  vResize.addEventListener('pointerup', function () {
    if (!vhDrag) return;
    vhDrag = null;
    vResize.classList.remove('drag');

  });

  });

  $('#zoomSeg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-z]');
    if (!b) return;
    var z = +b.dataset.z;
    if (z === state.zoom) return;
    state.zoom = z;
    state.scale = 1;
    updateScaleUI();
    document.querySelectorAll('#zoomSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
    if (state.tab === 'list') {
      if (state.listFrom != null) state.listTo = state.listFrom + (Math.round(zoomDays(z)) - 1) * MS;

  function rebuildAroundAnchor() {
    refitDayW();
    var aT = Date.UTC(state.anchor.y, state.anchor.m, 1);
    var ahead = BUF_MONTHS + Math.ceil(zoomDays(state.zoom) / 30.4375);
    bufStartT = monthAddT(aT, -BUF_MONTHS);
    bufEndT = monthAddT(aT, ahead);
    savedScroll = (aT - bufStartT) / MS * dayW;
    renderTimeline();
    renderToolbar();
    updateEmptyOverlay();
  }
  function setScale(f) {
    var center = dateAtLeft() + chartViewMs() / 2;
    state.scale = Math.min(3, Math.max(0.4, +(state.scale * f).toFixed(3)));
    refitDayW();
    savedScroll = Math.max(0, (center - bufStartT) / MS * dayW - Math.max(tl.clientWidth - laneW(), 0) / 2);
    renderTimeline(); renderToolbar(); updateEmptyOverlay(); updateScaleUI(); save();
  }

    rebuildAfterFilter();
  });
  $('#drawerBody').addEventListener('change', function (e) {
    var c = e.target.closest('input[data-g]');
    if (!c) return;
    var g = c.dataset.g, on = c.checked;
    toggleFilter(g, c.value, on);
    if (g === 'sections') {
      var evs = orderedItems(c.value);
      evs.forEach(function (nm) { toggleFilter('items', nm, on); });
      var grp = c.closest('.dgroup');
      if (grp) grp.querySelectorAll('input[data-g="items"]').forEach(function (cb) { cb.checked = on; });
    }
    buildFilterSets(); computeFiltered(); recomputeLanes();
    updateBadge(); refresh(); updateDrawerFoot(); save();
  });
  $('#drawerBody').addEventListener('click', function (e) {
    if (e.target.closest('[data-topall]')) { setTopAll(true); return; }
    if (e.target.closest('[data-topnone]')) { setTopAll(false); return; }
    var g = e.target.closest('.dgroup');
    if (!g) return;
    if (g.getAttribute('data-sec') === '__years') {
      if (e.target.closest('[data-allyr]')) setYears(true);
      if (e.target.closest('[data-noneyr]')) setYears(false);
    }
  });
  $('#drawerBody').addEventListener('input', function (e) {
    if (!e.target.classList.contains('dsearch')) return;
    var q = e.target.value.toLowerCase();
    document.querySelectorAll('#drawerBody .dgroup').forEach(function (g) {
      if (g.getAttribute('data-sec') === '__years') { g.style.display = q ? 'none' : ''; return; }
      var secRow = g.querySelector('.dsec');
      var secName = secRow.querySelector('.dv').textContent.toLowerCase();
      var secMatch = secName.indexOf(q) >= 0;
      secRow.style.display = secMatch ? '' : 'none';
      var any = secMatch;
      g.querySelectorAll('.devt').forEach(function (r) {
        var m = secMatch || r.textContent.toLowerCase().indexOf(q) >= 0;
        r.style.display = m ? '' : 'none';
        if (m) any = true;
      });
      g.style.display = any ? '' : 'none';
    });
  });

  tl.addEventListener('scroll', function () {
    hideTip();
    pinned = false;
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(function () { scrollRaf = 0; handleScrollFrame(); });
  }, { passive: true });

  tl.addEventListener('click', function (e) {
    if (e.target.closest('#jumpFirst')) {
      var ev = filtered.slice().sort(function (a, b) { return a.start - b.start; })[0];
      if (ev) goToDate(ev.start);
      return;
    }
    if (e.target.closest('#clearF')) {
      state.filters = { sections: [], items: [], years: [] };
      rebuildAfterFilter();
      return;
    }
    var b = e.target.closest('.bar');
    if (b) { pinned = true; showTip(b); }
    else { pinned = false; hideTip(); }
  });

  /* the pane never closes from its own clicks — only outside clicks, Esc, or scrolling */
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.bar') && !e.target.closest('#tip')) { pinned = false; hideTip(); }
  });

  $('#pane-list').addEventListener('click', function (e) {
    var th = e.target.closest('.atable th[data-col]');
    if (th) {
      var c = th.dataset.col;
      if (state.tsort.col === c) state.tsort.dir = state.tsort.dir === 'asc' ? 'desc' : 'asc';
      else state.tsort = { col: c, dir: 'asc' };
      renderList(); save();
      return;
    }
    var f = e.target.closest('[data-fmt]');
    if (f) { state.listFormat = f.dataset.fmt; renderList(); save(); return; }
    var s = e.target.closest('[data-sort]');
    if (s && !s.disabled) { state.sort = s.dataset.sort; renderList(); save(); return; }
    var r = e.target.closest('[data-id]');
    if (r) { pinned = true; showTip(r); }
  });
  $('#pane-list').addEventListener('scroll', function () { pinned = false; hideTip(); }, true);

  function jumpToEvent(id) {
    var ev = events.find(function (x) { return x.id === id; });
    if (!ev) return;
    pinned = false;
    hideTip();
    setTab('calendar');
    goToDate(ev.start);
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var b = tl.querySelector('.bar[data-id="' + id + '"]');
      if (b) {
        b.scrollIntoView({ block: 'nearest', inline: 'center' });
        savedScroll = tl.scrollLeft;
        b.classList.add('flash');
        setTimeout(function () { b.classList.remove('flash'); }, 1500);
      }
    }); });
    save();
  }

  /* themes pane */
  $('#pane-themes').addEventListener('click', function (e) {
    if (e.target.closest('#loSave')) { $('#loInputRow').hidden = false; $('#loName').focus(); return; }
    if (e.target.closest('#loCancel')) { $('#loInputRow').hidden = true; return; }
    if (e.target.closest('#loConfirm')) {
      var name = ($('#loName').value || '').trim();
      if (!name) { $('#loName').focus(); return; }
      state.loadouts[name] = clone(state.colors);
      state.lastLoadout = name;
      save(); renderPane('themes');
      return;
    }
    if (e.target.closest('#loUpdate')) {
      if (!state.lastLoadout || !state.loadouts[state.lastLoadout]) return;
      state.loadouts[state.lastLoadout] = clone(state.colors);
      save();
      var b = e.target.closest('#loUpdate');
      b.textContent = 'updated';
      setTimeout(function () { if (b.isConnected) b.textContent = 'update'; }, 1200);
      return;
    }
    if (e.target.closest('#loDelete')) {
      if (state.lastLoadout) { delete state.loadouts[state.lastLoadout]; state.lastLoadout = ''; save(); renderPane('themes'); }
      return;
    }
    if (e.target.closest('#loExport')) { exportColours(); return; }
    if (e.target.closest('#loImport')) { $('#colImport').click(); return; }
    if (e.target.closest('#resetColours')) { resetColours(); return; }
    if (e.target.closest('#expReadable')) { exportEvents(false); return; }
    if (e.target.closest('#expMachine')) { exportEvents(true); return; }
    var ovT = e.target.closest('[data-ovsec]');
    if (ovT) {
      var sec = ovT.dataset.ovsec;
      if (state.colors.secOverride[sec]) delete state.colors.secOverride[sec];
      else state.colors.secOverride[sec] = true;
      save(); buildDrawer(); renderPane('themes');
      if (state.tab === 'calendar') renderTimeline();
      return;
    }
    if (e.target.closest('[data-ovall]')) {
      sections.forEach(function (s) { state.colors.secOverride[s] = true; });
      save(); buildDrawer(); renderPane('themes');
      if (state.tab === 'calendar') renderTimeline();
      return;
    }
    if (e.target.closest('[data-ovnone]')) {
      state.colors.secOverride = {};
      save(); buildDrawer(); renderPane('themes');
      if (state.tab === 'calendar') renderTimeline();
      return;
    }
    var ssw = e.target.closest('[data-secname]');
    if (ssw) { openColorPop('section', ssw.dataset.secname, ssw); return; }
    var f = e.target.closest('.fontopt');
    if (f) { state.font = f.dataset.font; applyFont(); renderPane('themes'); refresh(); save(); return; }
    var d = e.target.closest('[data-density]');
    if (d) { state.density = d.dataset.density; renderPane('themes'); if (state.tab === 'calendar') renderTimeline(); save(); return; }
    var sw = e.target.closest('[data-cname]');
    if (sw) { openColorPop('event', sw.dataset.cname, sw); return; }
    if (e.target.closest('#resetBtn')) {
      if (!resetArmed) { resetArmed = true; renderPane('themes'); setTimeout(function () { resetArmed = false; }, 3000); }
      else { try { localStorage.removeItem(LS_KEY); } catch (e2) {} location.reload(); }
    }
  });
  $('#pane-themes').addEventListener('change', function (e) {
    if (e.target.id === 'loSelect') {
      var n = e.target.value;
      if (n && state.loadouts[n]) {
        state.colors = clone(state.loadouts[n]);
        state.lastLoadout = n;
        save(); renderPane('themes');
        if (state.tab === 'calendar') renderTimeline();
      }
      return;
    }
    if (e.target.id === 'wkndSw') { state.weekends = e.target.checked; save(); if (state.tab === 'calendar') renderTimeline(); }
    if (e.target.id === 'lblSw') { state.labels = e.target.checked; save(); if (state.tab === 'calendar') renderTimeline(); }
    if (e.target.id === 'flSw') { state.showFL = e.target.checked; $('#flBtn').classList.toggle('on', state.showFL); refresh(); save(); }
  });
  $('#pane-themes').addEventListener('keydown', function (e) {
    if (e.target.id === 'loName' && e.key === 'Enter') { e.preventDefault(); $('#loConfirm').click(); }
  });
  $('#colImport').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var fi = f;
    fi.text().then(function (t) { importColoursText(t); });
    e.target.value = '';
  });

  document.addEventListener('click', function (e) {
    if (e.target.closest('#noticeLoad')) $('#fileInput').click();
    if (e.target.closest('#noticeClose')) { noticeDismissed = true; updateNotice(); }
  });

  $('#fileInput').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var ff = f;
    ff.text().then(function (t) { applyText(t, ff.name, 'session'); });
    e.target.value = '';
  });

  var dragDepth = 0;
  function draggingFiles(e) {
    return !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'));
  }
  addEventListener('dragenter', function (e) {
    e.preventDefault();
    if (!draggingFiles(e)) return;
    if (++dragDepth === 1) $('#drop').classList.add('on');
  });
  addEventListener('dragover', function (e) { e.preventDefault(); });
  addEventListener('dragleave', function (e) {
    e.preventDefault();
    if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); }
  });
  addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    $('#drop').classList.remove('on');
    if (!draggingFiles(e)) return;
    var f = e.dataTransfer.files[0];
    if (f) f.text().then(function (t) { applyText(t, f.name, 'session'); });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { pinned = false; hideTip(); closePop(); document.body.classList.remove('drawer-open'); }
  });

  new ResizeObserver(function () {
    if (state.tab !== 'calendar') return;
    cancelAnimationFrame(roTimer);
    roTimer = requestAnimationFrame(function () {
      var w = tl.clientWidth;
      if (Math.abs(w - lastW) <= 8) return;
      lastW = w;
      var center = dateAtLeft() + chartViewMs() / 2;
      refitDayW();
      savedScroll = Math.max(0, (center - bufStartT) / MS * dayW - Math.max(tl.clientWidth - laneW(), 0) / 2);
      renderTimeline(); renderToolbar(); updateEmptyOverlay();
    });
  }).observe(tl);

  /* ── init ── */
  loadSettings();
  applyTheme();
  applyFont();
  $('#flBtn').classList.toggle('on', state.showFL);
  $('#flBtn').setAttribute('aria-pressed', state.showFL);
  document.querySelectorAll('#zoomSeg button').forEach(function (b) { b.classList.toggle('on', +b.dataset.z === state.zoom); });
  updateScaleUI();
  refitDayW();
  var initAT = Date.UTC(state.anchor.y, state.anchor.m, 1);
  bufStartT = monthAddT(initAT, -BUF_MONTHS);
  bufEndT = monthAddT(initAT, BUF_MONTHS + Math.ceil(zoomDays(state.zoom) / 30.4375));
  savedScroll = (initAT - bufStartT) / MS * dayW;
  lastW = tl.clientWidth;
  applyVHeight();
  if (state.drawerW) drawerEl.style.width = Math.min(state.drawerW, Math.max(300, innerWidth - 24)) + 'px';
  setTab(state.tab);
  updateNotice();
  updateBadge();
  loadData();
  fetchDefaultTemplate();
  fetchEventLinks();
})();
</script>
</body>
</html>
